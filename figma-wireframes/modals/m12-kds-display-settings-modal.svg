<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Backdrop -->
  <rect width="1440" height="900" fill="#111827" fill-opacity="0.45"/>
  
    <g transform="translate(480, 200)">
      <rect width="480" height="480" rx="24" fill="#FFFFFF" stroke="#D1D5DB"/>
      <g transform="translate(35, 30)">
        <text x="0" y="20" font-size="18" class="bold" fill="#111827">KDS Display &amp; Sound Settings</text>
        
        <g transform="translate(0, 50)">
          <text x="0" y="15" font-size="11" class="bold" fill="#374151">Station Routing Mode</text>
          <rect x="0" y="22" width="410" height="38" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="14" y="46" font-size="12" class="semi" fill="#111827">Expo / All Stations (Master View)</text>

          <text x="0" y="90" font-size="11" class="bold" fill="#374151">Rush Order Alarm Bell</text>
          <rect x="0" y="98" width="410" height="44" rx="8" fill="#F9FAFB"/>
          <text x="16" y="125" font-size="12" class="bold" fill="#111827">Sound Alert on New Rush Order: ON</text>

          <text x="0" y="170" font-size="11" class="bold" fill="#374151">Target Fulfillment Window (Minutes)</text>
          <rect x="0" y="178" width="410" height="38" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="14" y="202" font-size="12" class="semi" fill="#111827">06 Minutes (Standard)</text>
        </g>

        <g transform="translate(0, 360)">
          <rect width="410" height="44" rx="12" fill="#1F2937"/>
          <text x="205" y="27" font-size="12" class="bold" fill="#FFFFFF" text-anchor="middle">Save KDS Settings</text>
        </g>
      </g>
    </g>
  
</svg>