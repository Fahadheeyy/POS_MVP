<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Backdrop -->
  <rect width="1440" height="900" fill="#111827" fill-opacity="0.45"/>
  
    <g transform="translate(480, 200)">
      <rect width="480" height="480" rx="24" fill="#FFFFFF" stroke="#D1D5DB"/>
      <g transform="translate(35, 30)">
        <text x="0" y="20" font-size="18" class="bold" fill="#111827">+ Cash Movement Entry</text>
        <text x="0" y="38" font-size="11" class="regular" fill="#6B7280">Record paid-in or paid-out drawer movements</text>

        <g transform="translate(0, 60)">
          <!-- Toggle -->
          <rect width="410" height="40" rx="8" fill="#F3F4F6"/>
          <rect width="205" height="40" rx="8" fill="#1F2937"/>
          <text x="102" y="25" font-size="11" class="bold" fill="#FFFFFF" text-anchor="middle">Paid-In (Add Cash)</text>
          <text x="307" y="25" font-size="11" class="semi" fill="#4B5563" text-anchor="middle">Paid-Out (Petty Cash)</text>

          <text x="0" y="70" font-size="11" class="bold" fill="#374151">Amount (₹) *</text>
          <rect x="0" y="77" width="410" height="38" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="14" y="101" font-size="13" class="bold" fill="#111827">₹1,000.00</text>

          <text x="0" y="135" font-size="11" class="bold" fill="#374151">Reason / Expense Description</text>
          <rect x="0" y="142" width="410" height="38" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="14" y="166" font-size="12" class="regular" fill="#4B5563">Additional change denominations from bank</text>
        </g>

        <g transform="translate(0, 360)">
          <rect width="410" height="44" rx="12" fill="#1F2937"/>
          <text x="205" y="27" font-size="12" class="bold" fill="#FFFFFF" text-anchor="middle">Record Cash Movement</text>
        </g>
      </g>
    </g>
  
</svg>