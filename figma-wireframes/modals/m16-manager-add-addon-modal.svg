<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Backdrop -->
  <rect width="1440" height="900" fill="#111827" fill-opacity="0.45"/>
  
    <g transform="translate(480, 220)">
      <rect width="480" height="420" rx="24" fill="#FFFFFF" stroke="#D1D5DB"/>
      <g transform="translate(35, 30)">
        <text x="0" y="20" font-size="18" class="bold" fill="#111827">+ Add Topping / Add-on Item</text>

        <g transform="translate(0, 50)">
          <text x="0" y="15" font-size="11" class="bold" fill="#374151">Target Group</text>
          <rect x="0" y="22" width="410" height="36" rx="8" fill="#F3F4F6"/>
          <text x="12" y="45" font-size="12" class="semi" fill="#111827">Sauces &amp; Syrups</text>

          <text x="0" y="80" font-size="11" class="bold" fill="#374151">Topping / Add-on Name</text>
          <rect x="0" y="87" width="410" height="36" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="12" y="110" font-size="12" class="semi" fill="#111827">Roasted Walnut Flakes</text>

          <text x="0" y="145" font-size="11" class="bold" fill="#374151">Extra Price (₹)</text>
          <rect x="0" y="152" width="410" height="36" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="12" y="175" font-size="12" class="semi" fill="#111827">₹50.00</text>
        </g>

        <g transform="translate(0, 310)">
          <rect width="410" height="44" rx="12" fill="#1F2937"/>
          <text x="205" y="27" font-size="12" class="bold" fill="#FFFFFF" text-anchor="middle">Save Topping Item</text>
        </g>
      </g>
    </g>
  
</svg>