<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Backdrop -->
  <rect width="1440" height="900" fill="#111827" fill-opacity="0.45"/>
  
    <g transform="translate(320, 150)">
      <rect width="800" height="600" rx="24" fill="#FFFFFF" stroke="#D1D5DB"/>
      
      <!-- Close button -->
      <circle cx="760" cy="40" r="14" fill="#F3F4F6"/>
      <text x="760" y="44" font-size="12" class="bold" fill="#6B7280" text-anchor="middle">✕</text>

      <!-- Left Column: Dish Photo -->
      <g transform="translate(40, 50)">
        <rect width="320" height="420" rx="16" fill="#F9FAFB" stroke="#E5E7EB"/>
        
    <g transform="translate(35, 70)">
      <rect width="250" height="240" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
      <line x1="0" y1="0" x2="250" y2="240" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="240" x2="250" y2="0" stroke="#E5E7EB" stroke-width="1"/>
      <rect x="100" y="110" width="50" height="20" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
      <text x="125" y="124" font-size="9" class="bold" fill="#9CA3AF" text-anchor="middle">DISH PHOTO</text>
    </g>
  
        <text x="160" y="340" font-size="16" class="bold" fill="#111827" text-anchor="middle">Qashtuta Nutella Pistachio</text>
        <text x="160" y="365" font-size="14" class="bold" fill="#4B5563" text-anchor="middle">Base Price: ₹320.00</text>
      </g>

      <!-- Right Column: Options & Toppings -->
      <g transform="translate(400, 50)">
        <text x="0" y="24" font-size="16" class="bold" fill="#111827">Customise Dish Add-ons</text>
        <text x="0" y="42" font-size="11" class="regular" fill="#6B7280">Select extra toppings and syrups for this order</text>

        <!-- Group 1: Sauces -->
        <g transform="translate(0, 70)">
          <text x="0" y="0" font-size="12" class="bold" fill="#374151">Sauces &amp; Syrups (Max 2)</text>
          
          <rect x="0" y="12" width="360" height="44" rx="8" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.5"/>
          <text x="16" y="38" font-size="12" class="bold" fill="#111827">Extra Belgian Nutella</text>
          <text x="344" y="38" font-size="11" class="bold" fill="#111827" text-anchor="end">+₹40.00 ✓</text>

          <rect x="0" y="64" width="360" height="44" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="16" y="90" font-size="12" class="medium" fill="#374151">Lotus Biscoff Drizzle</text>
          <text x="344" y="90" font-size="11" class="medium" fill="#6B7280" text-anchor="end">+₹40.00</text>
        </g>

        <!-- Group 2: Crunchy Nuts -->
        <g transform="translate(0, 205)">
          <text x="0" y="0" font-size="12" class="bold" fill="#374151">Crunchy Nuts &amp; Toppings (Max 2)</text>

          <rect x="0" y="12" width="360" height="44" rx="8" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.5"/>
          <text x="16" y="38" font-size="12" class="bold" fill="#111827">Crushed Iranian Pistachio</text>
          <text x="344" y="38" font-size="11" class="bold" fill="#111827" text-anchor="end">+₹40.00 ✓</text>

          <rect x="0" y="64" width="360" height="44" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="16" y="90" font-size="12" class="medium" fill="#374151">Roasted Almond Flakes</text>
          <text x="344" y="90" font-size="11" class="medium" fill="#6B7280" text-anchor="end">+₹30.00</text>
        </g>

        <!-- Quantity Stepper & Submit -->
        <g transform="translate(0, 380)">
          <rect width="110" height="46" rx="10" fill="#F3F4F6" stroke="#D1D5DB"/>
          <text x="22" y="28" font-size="16" class="bold" fill="#111827">-</text>
          <text x="55" y="28" font-size="14" class="bold" fill="#111827" text-anchor="middle">1</text>
          <text x="88" y="28" font-size="16" class="bold" fill="#111827">+</text>

          <rect x="125" y="0" width="235" height="46" rx="10" fill="#1F2937"/>
          <text x="242" y="28" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">Add to Cart · ₹400.00</text>
        </g>
