<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Backdrop -->
  <rect width="1440" height="900" fill="#111827" fill-opacity="0.45"/>
  
    <g transform="translate(450, 140)">
      <rect width="540" height="620" rx="24" fill="#FFFFFF" stroke="#D1D5DB"/>
      <g transform="translate(35, 30)">
        <text x="0" y="20" font-size="18" class="bold" fill="#111827">+ Add New Menu Dish</text>

        <g transform="translate(0, 50)">
          <text x="0" y="15" font-size="11" class="bold" fill="#374151">Dish Name *</text>
          <rect x="0" y="22" width="470" height="36" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="12" y="45" font-size="12" class="semi" fill="#111827">Basbousa Royal Almond</text>

          <text x="0" y="80" font-size="11" class="bold" fill="#374151">Base Price (₹) *</text>
          <rect x="0" y="87" width="220" height="36" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="12" y="110" font-size="12" class="semi" fill="#111827">₹249.00</text>

          <text x="250" y="80" font-size="11" class="bold" fill="#374151">Category</text>
          <rect x="250" y="87" width="220" height="36" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="262" y="110" font-size="12" class="semi" fill="#111827">Egyptian Sweets</text>

          <text x="0" y="145" font-size="11" class="bold" fill="#374151">Kitchen Fulfillment Station</text>
          <rect x="0" y="152" width="470" height="36" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="12" y="175" font-size="12" class="semi" fill="#111827">Cold Station</text>
        </g>

        <g transform="translate(0, 500)">
          <rect width="470" height="46" rx="12" fill="#1F2937"/>
          <text x="235" y="28" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">Save Dish to POS Catalog</text>
        </g>
      </g>
    </g>
  
</svg>