<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
    <rect width="1440" height="900" fill="rgba(17, 24, 39, 0.5)"/>
    <g transform="translate(480, 260)">
      <rect width="480" height="380" rx="24" fill="#FFFFFF" stroke="#E5E7EB" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.25))"/>
      
  <g transform="translate(40, 40)">
    <text x="0" y="24" font-size="18" class="bold" fill="#111827">Special Kitchen Instructions</text>
    <text x="0" y="46" font-size="12" class="regular" fill="#6B7280">Pass custom preparation note to kitchen chefs</text>

    <rect x="0" y="70" width="400" height="110" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="16" y="30" font-size="13" class="regular" fill="#111827">Extra warm sauce on the side. Severe nut allergy for 1 guest.</text>

    <!-- Quick pills -->
    <g transform="translate(0, 200)">
      
        <rect x="0" y="0" width="94" height="28" rx="8" fill="#F3F4F6"/>
        <text x="47" y="18" font-size="10" class="bold" fill="#374151" text-anchor="middle">Less Sugar</text>
      
        <rect x="102" y="0" width="94" height="28" rx="8" fill="#F3F4F6"/>
        <text x="149" y="18" font-size="10" class="bold" fill="#374151" text-anchor="middle">No Nuts</text>
      
        <rect x="204" y="0" width="94" height="28" rx="8" fill="#F3F4F6"/>
        <text x="251" y="18" font-size="10" class="bold" fill="#374151" text-anchor="middle">Extra Heated</text>
      
        <rect x="306" y="0" width="94" height="28" rx="8" fill="#F3F4F6"/>
        <text x="353" y="18" font-size="10" class="bold" fill="#374151" text-anchor="middle">Separately Packed</text>
      
    </g>

    <rect x="0" y="250" width="400" height="48" rx="12" fill="#111827"/>
    <text x="200" y="280" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">Attach Note to KOT Ticket</text>
  </g>

    </g>
  
</svg>