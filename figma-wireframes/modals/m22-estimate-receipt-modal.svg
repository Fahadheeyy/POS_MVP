<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
    <rect width="1440" height="900" fill="rgba(17, 24, 39, 0.5)"/>
    <g transform="translate(500, 190)">
      <rect width="440" height="520" rx="24" fill="#FFFFFF" stroke="#E5E7EB" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.25))"/>
      
  <g transform="translate(40, 40)">
    <text x="0" y="24" font-size="18" class="bold" fill="#111827">Estimate / Pro-Forma Check</text>
    <text x="0" y="46" font-size="12" class="regular" fill="#6B7280">Preliminary table bill before final payment tender</text>
    
    <rect x="0" y="70" width="360" height="280" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
    <g transform="translate(20, 20)">
      <text x="160" y="16" font-size="13" class="bold" fill="#111827" text-anchor="middle">PRO-FORMA CHECK · T01</text>
      <text x="0" y="50" font-size="12" class="regular" fill="#4B5563">1× Lotus Biscoff Qashtuta</text>
      <text x="320" y="50" font-size="12" class="bold" fill="#111827" text-anchor="end">₹339.00</text>
      <text x="0" y="76" font-size="12" class="regular" fill="#4B5563">1× Karak Chai Glass</text>
      <text x="320" y="76" font-size="12" class="bold" fill="#111827" text-anchor="end">₹60.00</text>
      <line x1="0" y1="95" x2="320" y2="95" stroke="#E5E7EB"/>
      <text x="0" y="120" font-size="12" class="regular" fill="#4B5563">GST (5%)</text>
      <text x="320" y="120" font-size="12" class="bold" fill="#111827" text-anchor="end">₹19.95</text>
      <line x1="0" y1="135" x2="320" y2="135" stroke="#111827"/>
      <text x="0" y="165" font-size="15" class="bold" fill="#111827">TOTAL DUE</text>
      <text x="320" y="165" font-size="16" class="bold" fill="#10B981" text-anchor="end">₹419.00</text>
    </g>

    <rect x="0" y="380" width="360" height="48" rx="12" fill="#111827"/>
    <text x="180" y="410" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">🖨 Print Check to 80mm Printer</text>
  </g>

    </g>
  
</svg>