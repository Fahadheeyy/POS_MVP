<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Backdrop -->
  <rect width="1440" height="900" fill="#111827" fill-opacity="0.45"/>
  
    <g transform="translate(520, 160)">
      <rect width="400" height="540" rx="24" fill="#FFFFFF" stroke="#D1D5DB"/>
      <g transform="translate(40, 35)">
        <circle cx="160" cy="30" r="24" fill="#FEE2E2"/>
        <text x="160" y="38" font-size="18" class="bold" fill="#B91C1C" text-anchor="middle">🔒</text>
        
        <text x="160" y="80" font-size="18" class="bold" fill="#111827" text-anchor="middle">Manager Authorization</text>
        <text x="160" y="100" font-size="11" class="regular" fill="#6B7280" text-anchor="middle">Enter 4-digit Manager PIN to approve</text>
        
        <!-- 4 PIN Dots -->
        <g transform="translate(100, 125)">
          <circle cx="10" cy="10" r="6" fill="#1F2937"/>
          <circle cx="45" cy="10" r="6" fill="#1F2937"/>
          <circle cx="80" cy="10" r="6" fill="#D1D5DB"/>
          <circle cx="115" cy="10" r="6" fill="#D1D5DB"/>
        </g>

        <!-- Mini 3x4 Keypad -->
        <g transform="translate(30, 170)">
          
                    <rect x="0" y="0" width="80" height="46" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
                    <text x="40" y="28" font-size="16" class="bold" fill="#111827" text-anchor="middle">1</text>
                  
                    <rect x="90" y="0" width="80" height="46" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
                    <text x="130" y="28" font-size="16" class="bold" fill="#111827" text-anchor="middle">2</text>
                  
                    <rect x="180" y="0" width="80" height="46" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
                    <text x="220" y="28" font-size="16" class="bold" fill="#111827" text-anchor="middle">3</text>
                  
                    <rect x="0" y="55" width="80" height="46" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
                    <text x="40" y="83" font-size="16" class="bold" fill="#111827" text-anchor="middle">4</text>
                  
                    <rect x="90" y="55" width="80" height="46" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
                    <text x="130" y="83" font-size="16" class="bold" fill="#111827" text-anchor="middle">5</text>
                  
                    <rect x="180" y="55" width="80" height="46" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
                    <text x="220" y="83" font-size="16" class="bold" fill="#111827" text-anchor="middle">6</text>
                  
                    <rect x="0" y="110" width="80" height="46" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
                    <text x="40" y="138" font-size="16" class="bold" fill="#111827" text-anchor="middle">7</text>
                  
                    <rect x="90" y="110" width="80" height="46" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
                    <text x="130" y="138" font-size="16" class="bold" fill="#111827" text-anchor="middle">8</text>
                  
                    <rect x="180" y="110" width="80" height="46" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
                    <text x="220" y="138" font-size="16" class="bold" fill="#111827" text-anchor="middle">9</text>
                  
                    <rect x="0" y="165" width="80" height="46" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
                    <text x="40" y="193" font-size="16" class="bold" fill="#111827" text-anchor="middle">C</text>
                  
                    <rect x="90" y="165" width="80" height="46" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
                    <text x="130" y="193" font-size="16" class="bold" fill="#111827" text-anchor="middle">0</text>
                  
                    <rect x="180" y="165" width="80" height="46" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
                    <text x="220" y="193" font-size="16" class="bold" fill="#111827" text-anchor="middle">⌫</text>
                  

          <rect x="0" y="235" width="260" height="44" rx="10" fill="#1F2937"/>
          <text x="130" y="262" font-size="12" class="bold" fill="#FFFFFF" text-anchor="middle">Authorize Action</text>
        </g>
      </g>
    </g>
  
</svg>