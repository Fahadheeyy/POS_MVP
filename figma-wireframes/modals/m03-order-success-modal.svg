<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Backdrop -->
  <rect width="1440" height="900" fill="#111827" fill-opacity="0.45"/>
  
    <g transform="translate(280, 160)">
      <rect width="880" height="580" rx="28" fill="#FFFFFF" stroke="#D1D5DB"/>
      <line x1="440" y1="0" x2="440" y2="580" stroke="#E5E7EB"/>

      <!-- Left Column: Order Summary -->
      <g transform="translate(40, 40)">
        <text x="180" y="24" font-size="18" class="bold" fill="#111827" text-anchor="middle">Order Details</text>
        
        <g transform="translate(0, 50)">
          <text x="0" y="20" font-size="11" class="regular" fill="#6B7280">Order Number</text>
          <text x="360" y="20" font-size="12" class="bold" fill="#111827" text-anchor="end">Token #106</text>

          <text x="0" y="45" font-size="11" class="regular" fill="#6B7280">Fulfillment Type</text>
          <text x="360" y="45" font-size="12" class="semi" fill="#111827" text-anchor="end">Dine-In · Table 04</text>

          <text x="0" y="70" font-size="11" class="regular" fill="#6B7280">Customer Name</text>
          <text x="360" y="70" font-size="12" class="semi" fill="#111827" text-anchor="end">Rahul Verma</text>

          <text x="0" y="95" font-size="11" class="regular" fill="#6B7280">Payment Method</text>
          <text x="360" y="95" font-size="12" class="bold" fill="#111827" text-anchor="end">UPI (PAID)</text>
        </g>

        <line x1="0" y1="180" x2="360" y2="180" stroke="#E5E7EB"/>

        <!-- Items -->
        <g transform="translate(0, 200)">
          <text x="0" y="16" font-size="12" class="medium" fill="#111827">1x Qashtuta Nutella Pistachio</text>
          <text x="360" y="16" font-size="12" class="bold" fill="#111827" text-anchor="end">₹320.00</text>

          <text x="0" y="40" font-size="12" class="medium" fill="#111827">2x Umm Ali Royal Claypot</text>
          <text x="360" y="40" font-size="12" class="bold" fill="#111827" text-anchor="end">₹440.00</text>

          <text x="0" y="64" font-size="12" class="medium" fill="#111827">1x Egyptian Karkadeh Tea</text>
          <text x="360" y="64" font-size="12" class="bold" fill="#111827" text-anchor="end">₹140.00</text>
        </g>

        <line x1="0" y1="360" x2="360" y2="360" stroke="#E5E7EB"/>

        <g transform="translate(0, 385)">
          <text x="0" y="20" font-size="12" class="regular" fill="#6B7280">Subtotal</text>
          <text x="360" y="20" font-size="12" class="semi" fill="#111827" text-anchor="end">₹940.00</text>

          <text x="0" y="42" font-size="12" class="regular" fill="#6B7280">GST 5%</text>
          <text x="360" y="42" font-size="12" class="semi" fill="#111827" text-anchor="end">₹47.00</text>

          <text x="0" y="70" font-size="15" class="bold" fill="#111827">Total Paid</text>
          <text x="360" y="70" font-size="18" class="bold" fill="#111827" text-anchor="end">₹987.00</text>
        </g>
      </g>

      <!-- Right Column: Success Callout -->
      <g transform="translate(480, 50)">
        <circle cx="180" cy="90" r="45" fill="#1F2937"/>
        <text x="180" y="102" font-size="34" class="bold" fill="#FFFFFF" text-anchor="middle">✓</text>

        <text x="180" y="180" font-size="24" class="bold" fill="#111827" text-anchor="middle">Order Successful!</text>
        <text x="180" y="205" font-size="12" class="medium" fill="#6B7280" text-anchor="middle">Token #106 created · Queued in kitchen</text>

        <!-- Auto-print notice badge -->
        <rect x="25" y="230" width="310" height="34" rx="17" fill="#F3F4F6"/>
        <text x="180" y="252" font-size="11" class="semi" fill="#10B981" text-anchor="middle">🖨️ Bill automatically sent to printer</text>

        <!-- Action Buttons -->
        <g transform="translate(25, 320)">
          <rect width="310" height="46" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="155" y="28" font-size="12" class="bold" fill="#374151" text-anchor="middle">🖨️ Reprint Bill Receipt</text>

          <rect y="60" width="310" height="48" rx="12" fill="#1F2937"/>
          <text x="155" y="89" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">+ Start New Order</text>
        </g>
      </g>
    </g>
  
</svg>