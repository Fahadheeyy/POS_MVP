<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Backdrop -->
  <rect width="1440" height="900" fill="#111827" fill-opacity="0.45"/>
  
    <g transform="translate(480, 200)">
      <rect width="480" height="480" rx="24" fill="#FFFFFF" stroke="#D1D5DB"/>
      <g transform="translate(35, 35)">
        <text x="0" y="20" font-size="18" class="bold" fill="#111827">Dine-In Table &amp; Guest Details</text>
        <text x="0" y="40" font-size="11" class="regular" fill="#6B7280">Assign dining session to table or record guest info</text>

        <g transform="translate(0, 70)">
          <text x="0" y="15" font-size="11" class="bold" fill="#374151">Table Number</text>
          <rect x="0" y="22" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="16" y="47" font-size="13" class="bold" fill="#111827">Table 04</text>

          <text x="220" y="15" font-size="11" class="bold" fill="#374151">Guest Count</text>
          <rect x="220" y="22" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="315" y="47" font-size="14" class="bold" fill="#111827" text-anchor="middle">2 Guests</text>

          <text x="0" y="90" font-size="11" class="bold" fill="#374151">Customer Name (Optional)</text>
          <rect x="0" y="97" width="410" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="16" y="122" font-size="13" class="regular" fill="#111827">Rahul Verma</text>

          <text x="0" y="165" font-size="11" class="bold" fill="#374151">Customer Phone (Loyalty / CRM)</text>
          <rect x="0" y="172" width="410" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="16" y="197" font-size="13" class="regular" fill="#111827">+91 98450 12345</text>
        </g>

        <!-- Save Button -->
        <g transform="translate(0, 350)">
          <rect width="410" height="46" rx="12" fill="#1F2937"/>
          <text x="205" y="28" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">Save Table &amp; Return to Cart</text>
        </g>
      </g>
    </g>
  
</svg>