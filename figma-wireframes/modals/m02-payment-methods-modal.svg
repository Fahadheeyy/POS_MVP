<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Backdrop -->
  <rect width="1440" height="900" fill="#111827" fill-opacity="0.45"/>
  
    <g transform="translate(480, 160)">
      <rect width="480" height="580" rx="24" fill="#FFFFFF" stroke="#D1D5DB"/>
      <circle cx="440" cy="35" r="14" fill="#F3F4F6"/>
      <text x="440" y="39" font-size="12" class="bold" fill="#6B7280" text-anchor="middle">✕</text>

      <g transform="translate(35, 35)">
        <text x="205" y="20" font-size="18" class="bold" fill="#111827" text-anchor="middle">Payment Methods</text>
        <text x="205" y="40" font-size="11" class="regular" fill="#6B7280" text-anchor="middle">Select customer payment tender</text>
        <text x="205" y="75" font-size="28" class="bold" fill="#111827" text-anchor="middle">₹987.00</text>

        <!-- 3 Tenders -->
        <g transform="translate(0, 95)">
          <!-- UPI -->
          <rect width="410" height="60" rx="12" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.5"/>
          <circle cx="35" cy="30" r="10" fill="#1F2937"/>
          <text x="35" y="34" font-size="10" class="bold" fill="#FFFFFF" text-anchor="middle">✓</text>
          <text x="60" y="26" font-size="13" class="bold" fill="#111827">UPI Dynamic QR / VPA</text>
          <text x="60" y="42" font-size="10" class="regular" fill="#6B7280">GPay, PhonePe, Paytm, BHIM</text>
          <rect x="330" y="18" width="60" height="22" rx="4" fill="#D1FAE5"/>
          <text x="360" y="33" font-size="9" class="bold" fill="#065F46" text-anchor="middle">Fastest</text>

          <!-- Cash -->
          <g transform="translate(0, 70)">
            <rect width="410" height="60" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
            <circle cx="35" cy="30" r="10" fill="#E5E7EB"/>
            <text x="60" y="26" font-size="13" class="bold" fill="#111827">Cash Counter Drawer</text>
            <text x="60" y="42" font-size="10" class="regular" fill="#6B7280">Tender calculator &amp; change return</text>
          </g>

          <!-- Card -->
          <g transform="translate(0, 140)">
            <rect width="410" height="60" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
            <circle cx="35" cy="30" r="10" fill="#E5E7EB"/>
            <text x="60" y="26" font-size="13" class="bold" fill="#111827">Credit / Debit Card (EDC)</text>
            <text x="60" y="42" font-size="10" class="regular" fill="#6B7280">Visa, Mastercard, RuPay card swipe</text>
          </g>
        </g>

        <!-- Context Area: UPI QR Demo -->
        <g transform="translate(0, 315)">
          <rect width="410" height="110" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
          <rect x="20" y="15" width="80" height="80" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="60" y="58" font-size="20" class="bold" fill="#111827" text-anchor="middle">QR</text>
          
          <text x="120" y="40" font-size="12" class="bold" fill="#111827">VPA: signlaban@icici</text>
          <text x="120" y="58" font-size="10" class="regular" fill="#6B7280">Customer scans dynamic QR to pay ₹987.00</text>
          <text x="120" y="78" font-size="10" class="bold" fill="#10B981">Waiting for instant webhook response...</text>
        </g>

        <!-- Submit Button -->
        <g transform="translate(0, 445)">
          <rect width="410" height="46" rx="12" fill="#1F2937"/>
          <text x="205" y="28" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">Confirm Payment (UPI) →</text>
        </g>
      </g>
    </g>
  
</svg>