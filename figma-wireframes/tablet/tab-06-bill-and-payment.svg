<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="768" viewBox="0 0 1024 768" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1024" height="768" fill="#F3F4F6"/>
  
  
    <rect x="0" y="0" width="1024" height="60" fill="#FFFFFF" stroke="#E5E7EB"/>
    <g transform="translate(24, 16)">
      <rect x="0" y="0" width="76" height="28" rx="6" fill="#1F2937"/>
      <text x="38" y="18" font-size="11" class="bold" fill="#FFFFFF" text-anchor="middle">POS.BITS</text>
      <text x="96" y="14" font-size="13" class="bold" fill="#111827">Tablet Checkout &amp; Tender</text>
      <text x="96" y="26" font-size="10" class="medium" fill="#6B7280">Total Due: ₹419.00</text>
    </g>

    <!-- Tab navigation -->
    <g transform="translate(360, 22)">
      
          <text x="0" y="16" font-size="12" class="bold" fill="#111827">Dine-In Tables</text>
          <line x1="0" y1="22" x2="84" y2="22" stroke="#111827" stroke-width="2"/>
        
          <text x="110" y="16" font-size="12" class="medium" fill="#6B7280">New Order</text>
          
        
          <text x="220" y="16" font-size="12" class="medium" fill="#6B7280">Orders Log</text>
          
        
          <text x="330" y="16" font-size="12" class="medium" fill="#6B7280">Shift</text>
          
        
    </g>

    <!-- Right Profile -->
    <g transform="translate(880, 14)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="#F3F4F6"/>
      <circle cx="16" cy="16" r="10" fill="#111827"/>
      <text x="16" y="20" font-size="9" class="bold" fill="#FFFFFF" text-anchor="middle">PR</text>
      <text x="34" y="16" font-size="11" class="bold" fill="#111827">Priya S.</text>
      <text x="34" y="26" font-size="8" class="regular" fill="#6B7280">Cashier</text>
    </g>
  
  <g transform="translate(182, 90)">
    <rect x="0" y="0" width="660" height="580" rx="24" fill="#FFFFFF" stroke="#E2E8F0"/>
    <g transform="translate(40, 36)">
      <text x="0" y="20" font-size="18" class="bold" fill="#111827">Select Payment Method</text>
      <text x="0" y="38" font-size="12" class="regular" fill="#6B7280">Order #045 · Table 05 · Amount: ₹419.00</text>

      <!-- 3 Primary Payment Cards -->
      <g transform="translate(0, 65)">
        <!-- UPI QR -->
        <rect x="0" y="0" width="180" height="120" rx="14" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
        <text x="20" y="36" font-size="14" class="bold" fill="#111827">UPI QR</text>
        <text x="20" y="56" font-size="10" class="regular" fill="#047857">Dynamic QR on standee</text>
        <text x="20" y="96" font-size="14" class="bold" fill="#10B981">₹419.00 [✓]</text>

        <!-- Cash -->
        <rect x="200" y="0" width="180" height="120" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
        <text x="220" y="36" font-size="14" class="bold" fill="#111827">Cash Drawer</text>
        <text x="220" y="56" font-size="10" class="regular" fill="#6B7280">Quick note change</text>
        <text x="220" y="96" font-size="13" class="semi" fill="#6B7280">Calculate Change</text>

        <!-- Card EDC -->
        <rect x="400" y="0" width="180" height="120" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
        <text x="420" y="36" font-size="14" class="bold" fill="#111827">Card Swipe/Tap</text>
        <text x="420" y="56" font-size="10" class="regular" fill="#6B7280">EDC Terminal sync</text>
        <text x="420" y="96" font-size="13" class="semi" fill="#6B7280">Visa / Master / RuPay</text>
      </g>

      <!-- Dynamic UPI QR Display Area -->
      <g transform="translate(0, 210)">
        <rect x="0" y="0" width="580" height="190" rx="16" fill="#F9FAFB" stroke="#E5E7EB"/>
        <!-- QR placeholder -->
        <rect x="30" y="25" width="140" height="140" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
        <rect x="45" y="40" width="110" height="110" fill="#111827"/>
        <rect x="55" y="50" width="30" height="30" fill="#FFFFFF"/>
        <rect x="115" y="50" width="30" height="30" fill="#FFFFFF"/>
        <rect x="55" y="110" width="30" height="30" fill="#FFFFFF"/>
        
        <g transform="translate(200, 45)">
          <text x="0" y="20" font-size="16" class="bold" fill="#111827">Scan & Pay ₹419.00</text>
          <text x="0" y="42" font-size="12" class="regular" fill="#6B7280">Listening for webhooks from Paytm / GPay / PhonePe...</text>
          <text x="0" y="68" font-size="11" class="medium" fill="#10B981">● Listening on port 5001 (0.8s heartbeat)</text>
          <rect x="0" y="85" width="160" height="32" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="80" y="106" font-size="11" class="bold" fill="#374151" text-anchor="middle">Simulate Customer Scan</text>
        </g>
      </g>

      <!-- Confirmation CTA -->
      <g transform="translate(0, 430)">
        <rect x="0" y="0" width="580" height="54" rx="14" fill="#10B981"/>
        <text x="290" y="33" font-size="15" class="bold" fill="#FFFFFF" text-anchor="middle">Confirm Payment Received & Auto-Print Receipt</text>
      </g>
    </g>
  </g>

</svg>