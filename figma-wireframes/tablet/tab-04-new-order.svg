<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="768" viewBox="0 0 1024 768" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1024" height="768" fill="#F3F4F6"/>
  
  
    <rect x="0" y="0" width="1024" height="60" fill="#FFFFFF" stroke="#E5E7EB"/>
    <g transform="translate(24, 16)">
      <rect x="0" y="0" width="76" height="28" rx="6" fill="#1F2937"/>
      <text x="38" y="18" font-size="11" class="bold" fill="#FFFFFF" text-anchor="middle">POS.BITS</text>
      <text x="96" y="14" font-size="13" class="bold" fill="#111827">Tablet New Order Creator</text>
      <text x="96" y="26" font-size="10" class="medium" fill="#6B7280">Select Order Type &amp; Customer</text>
    </g>

    <!-- Tab navigation -->
    <g transform="translate(360, 22)">
      
          <text x="0" y="16" font-size="12" class="medium" fill="#6B7280">Dine-In Tables</text>
          
        
          <text x="110" y="16" font-size="12" class="bold" fill="#111827">New Order</text>
          <line x1="110" y1="22" x2="164" y2="22" stroke="#111827" stroke-width="2"/>
        
          <text x="220" y="16" font-size="12" class="medium" fill="#6B7280">Orders Log</text>
          
        
          <text x="330" y="16" font-size="12" class="medium" fill="#6B7280">Shift</text>
          
        
    </g>

    <!-- Right Profile -->
    <g transform="translate(880, 14)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="#F3F4F6"/>
      <circle cx="16" cy="16" r="10" fill="#111827"/>
      <text x="16" y="20" font-size="9" class="bold" fill="#FFFFFF" text-anchor="middle">PR</text>
      <text x="34" y="16" font-size="11" class="bold" fill="#111827">Priya S.</text>
      <text x="34" y="26" font-size="8" class="regular" fill="#6B7280">Cashier</text>
    </g>
  
  <g transform="translate(182, 100)">
    <rect x="0" y="0" width="660" height="560" rx="24" fill="#FFFFFF" stroke="#E2E8F0"/>
    <g transform="translate(40, 36)">
      <text x="0" y="20" font-size="18" class="bold" fill="#111827">Create New Order</text>
      <text x="0" y="40" font-size="12" class="regular" fill="#6B7280">Select fulfillment type, customer loyalty details, and table assignment</text>

      <!-- Fulfillment 3 Tabs -->
      <g transform="translate(0, 65)">
        <rect x="0" y="0" width="180" height="54" rx="12" fill="#111827"/>
        <text x="90" y="32" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">🍽 Dine-In</text>
        <rect x="200" y="0" width="180" height="54" rx="12" fill="#F3F4F6" stroke="#E5E7EB"/>
        <text x="290" y="32" font-size="13" class="semi" fill="#4B5563" text-anchor="middle">🛍 Takeaway</text>
        <rect x="400" y="0" width="180" height="54" rx="12" fill="#F3F4F6" stroke="#E5E7EB"/>
        <text x="490" y="32" font-size="13" class="semi" fill="#4B5563" text-anchor="middle">🛵 Delivery / Online</text>
      </g>

      <!-- Form Inputs Grid -->
      <g transform="translate(0, 150)">
        <text x="0" y="16" font-size="12" class="bold" fill="#374151">Select Dining Table</text>
        <rect x="0" y="26" width="270" height="42" rx="10" fill="#F9FAFB" stroke="#D1D5DB"/>
        <text x="16" y="52" font-size="13" class="semi" fill="#111827">Table 05 (Available · 2 Pax)</text>
        <text x="250" y="52" font-size="12" fill="#9CA3AF" text-anchor="end">▼</text>

        <text x="310" y="16" font-size="12" class="bold" fill="#374151">Guest Count (Pax)</text>
        <rect x="310" y="26" width="270" height="42" rx="10" fill="#F9FAFB" stroke="#D1D5DB"/>
        <text x="326" y="52" font-size="13" class="semi" fill="#111827">2 Guests</text>
        <text x="560" y="52" font-size="12" fill="#9CA3AF" text-anchor="end">▼</text>

        <text x="0" y="96" font-size="12" class="bold" fill="#374151">Customer Name</text>
        <rect x="0" y="106" width="270" height="42" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
        <text x="16" y="132" font-size="13" class="regular" fill="#111827">Jesselyn Anamika</text>

        <text x="310" y="96" font-size="12" class="bold" fill="#374151">Phone Number (Loyalty CRM)</text>
        <rect x="310" y="106" width="270" height="42" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
        <text x="326" y="132" font-size="13" class="regular" fill="#111827">+91 98450 12345</text>
        <text x="560" y="132" font-size="10" class="bold" fill="#10B981" text-anchor="end">★ 180 Pts</text>
      </g>

      <!-- Proceed CTA -->
      <g transform="translate(0, 390)">
        <rect x="0" y="0" width="580" height="52" rx="14" fill="#111827"/>
        <text x="290" y="32" font-size="14" class="bold" fill="#FFFFFF" text-anchor="middle">Open Order & Launch POS Catalog →</text>
      </g>
    </g>
  </g>

</svg>