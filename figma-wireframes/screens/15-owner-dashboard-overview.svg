                    <text x="1320" y="22" font-size="12" class="bold" fill="#10B981" text-anchor="end">14.5%</text>
                  </g>
                
                  <g transform="translate(0, 104)">
                    <text x="16" y="22" font-size="12" class="bold" fill="#111827">Qashtuta Lotus Biscoff</text>
                    <text x="400" y="22" font-size="11" class="regular" fill="#4B5563">Egyptian Desserts</text>
                    <text x="700" y="22" font-size="12" class="bold" fill="#111827">18 bowls</text>
                    <text x="1000" y="22" font-size="12" class="bold" fill="#111827">₹5,760.00</text>
                    <text x="1320" y="22" font-size="12" class="bold" fill="#10B981" text-anchor="end">13.5%</text>
