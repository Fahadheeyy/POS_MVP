                  <text x="330" y="12" font-size="10" class="mono" fill="#374151" text-anchor="end">940.00</text>

                  <text x="0" y="28" font-size="10" class="mono" fill="#374151">CGST (2.5%):</text>
                  <text x="330" y="28" font-size="10" class="mono" fill="#374151" text-anchor="end">23.50</text>

                  <text x="0" y="44" font-size="10" class="mono" fill="#374151">SGST (2.5%):</text>
                  <text x="330" y="44" font-size="10" class="mono" fill="#374151" text-anchor="end">23.50</text>

                  <line x1="0" y1="55" x2="330" y2="55" stroke="#111827"/>
