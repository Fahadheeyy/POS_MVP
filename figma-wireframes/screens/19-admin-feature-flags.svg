                  <text x="330" y="45" font-size="11" class="bold mono" fill="#111827" text-anchor="end">440.00</text>

                  <text x="0" y="68" font-size="11" class="bold mono" fill="#111827">1x Egyptian Karkadeh Tea</text>
                  <text x="330" y="68" font-size="11" class="bold mono" fill="#111827" text-anchor="end">140.00</text>
                </g>

