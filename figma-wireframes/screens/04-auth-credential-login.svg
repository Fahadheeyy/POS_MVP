<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
    <!-- Split Screen 50/50 -->
    <!-- Left Half: Brand Hero -->
    <rect x="0" y="0" width="720" height="900" fill="#E5E7EB"/>
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="70" height="24" rx="4" fill="#1F2937"/>
      <text x="10" y="16" font-size="10" class="bold" fill="#FFFFFF">POS.BITS</text>
      <text x="85" y="16" font-size="12" class="bold" fill="#111827">Sign Laban · India&apos;s First Egyptian Dessert</text>
    </g>

    <!-- Hero Card on Left -->
    <g transform="translate(100, 160)">
      <rect width="520" height="560" rx="28" fill="#D1D5DB" stroke="#9CA3AF"/>
      <rect x="40" y="40" width="90" height="24" rx="12" fill="#1F2937"/>
      <text x="85" y="56" font-size="10" class="bold" fill="#FFFFFF" text-anchor="middle">SIGN LABAN</text>
      <rect x="360" y="40" width="120" height="24" rx="12" fill="#FFFFFF"/>
      <text x="420" y="56" font-size="10" class="medium" fill="#374151" text-anchor="middle">Indiranagar, BLR</text>

      
    <g transform="translate(160, 130)">
      <rect width="200" height="200" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
      <line x1="0" y1="0" x2="200" y2="200" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="200" x2="200" y2="0" stroke="#E5E7EB" stroke-width="1"/>
      <rect x="75" y="90" width="50" height="20" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
      <text x="100" y="104" font-size="9" class="bold" fill="#9CA3AF" text-anchor="middle">DESSERT HERO</text>
    </g>
  

      <!-- Bottom Tagline Box -->
      <g transform="translate(0, 420)">
        <rect width="520" height="140" rx="0" fill="#FFFFFF" fill-opacity="0.9"/>
        <text x="30" y="40" font-size="20" class="bold" fill="#111827">India&apos;s First Egyptian Dessert</text>
        <text x="30" y="65" font-size="12" class="regular" fill="#4B5563">Authentic Qashtuta, Umm Ali, Koushiri &amp; Saankorita sweets</text>
        <text x="30" y="82" font-size="12" class="regular" fill="#4B5563">powered by high-speed counter operations.</text>
        <line x1="30" y1="105" x2="80" y2="105" stroke="#1F2937" stroke-width="3"/>
      </g>
    </g>

    <!-- Right Half: Credential Form -->
    <rect x="720" y="0" width="720" height="900" fill="#FFFFFF"/>
    <g transform="translate(860, 240)">
      <text x="0" y="0" font-size="28" class="bold" fill="#111827">Welcome back!</text>
      <text x="0" y="24" font-size="13" class="regular" fill="#6B7280">Please enter your manager or owner credentials</text>

      <!-- Email Field -->
      <text x="0" y="80" font-size="11" class="bold" fill="#374151">Email / Username</text>
      <rect x="0" y="90" width="440" height="46" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
      <text x="16" y="118" font-size="13" class="medium" fill="#111827">alex@signlaban.in</text>

      <!-- Password Field -->
      <text x="0" y="165" font-size="11" class="bold" fill="#374151">Password</text>
      <rect x="0" y="175" width="440" height="46" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
      <text x="16" y="205" font-size="16" class="bold" fill="#111827">••••••••••••</text>
      <text x="410" y="203" font-size="12" class="semi" fill="#6B7280">👁</text>

      <!-- Remember & Forgot -->
      <g transform="translate(0, 240)">
        <rect x="0" y="0" width="16" height="16" rx="4" fill="#1F2937"/>
        <text x="8" y="12" font-size="11" class="bold" fill="#FFFFFF" text-anchor="middle">✓</text>
        <text x="26" y="13" font-size="12" class="regular" fill="#4B5563">Remember me</text>
        
        <text x="440" y="13" font-size="12" class="bold" fill="#111827" text-anchor="end">Forgot password?</text>
      </g>

      <!-- Log In Button -->
      <g transform="translate(0, 280)">
        <rect width="440" height="48" rx="14" fill="#1F2937"/>
        <text x="220" y="30" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">Log in</text>
      </g>

      <line x1="0" y1="380" x2="440" y2="380" stroke="#E5E7EB"/>
      <text x="0" y="410" font-size="11" class="regular" fill="#6B7280">Demo Password: <tspan class="bold">password123</tspan></text>
      <text x="440" y="410" font-size="11" class="bold" fill="#111827" text-anchor="end">← Switch role</text>
    </g>
  
</svg>