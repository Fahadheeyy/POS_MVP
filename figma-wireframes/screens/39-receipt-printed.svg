      <text x="166" y="58" font-size="10" class="regular" fill="#6B7280" text-anchor="middle">GSTIN: 29AABCS1429B1Z2 · FSSAI: 11223344556677</text>
      
      <line x1="0" y1="75" x2="332" y2="75" stroke="#111827" stroke-dasharray="4,4"/>
