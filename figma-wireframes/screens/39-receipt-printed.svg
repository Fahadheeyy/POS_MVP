    <!-- Serrated top edge -->
    <path d="M0 0 L15 10 L30 0 L45 10 L60 0 L75 10 L90 0 L105 10 L120 0 L135 10 L150 0 L165 10 L180 0 L195 10 L210 0 L225 10 L240 0 L255 10 L270 0 L285 10 L300 0 L315 10 L330 0 L345 10 L360 0 L375 10 L380 0" fill="#374151"/>
    
    <!-- Receipt content mono style -->
