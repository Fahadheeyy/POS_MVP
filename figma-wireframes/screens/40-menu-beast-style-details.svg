<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
  
    <!-- Global Header -->
    <rect x="0" y="0" width="1440" height="60" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    
    <!-- Brand / Module -->
    <g transform="translate(24, 15)">
      <rect x="0" y="0" width="80" height="30" rx="6" fill="#1F2937"/>
      <text x="12" y="20" font-size="11" class="bold" fill="#FFFFFF">POS.BITS</text>
      
      <line x1="92" y1="4" x2="92" y2="26" stroke="#E5E7EB" stroke-width="1"/>
      
      <text x="104" y="14" font-size="12" class="bold" fill="#111827">POS Menu Customization</text>
      <text x="104" y="27" font-size="10" class="medium" fill="#6B7280">Item Details &amp; Multi-topping Sheet</text>
      
      <rect x="250" y="4" width="110" height="18" rx="4" fill="#F3F4F6" stroke="#D1D5DB"/>
      <text x="256" y="17" font-size="9" class="bold" fill="#374151">Sign Laban · Indiranagar</text>
    </g>

    <!-- Sub-navigation Tabs & Live KPIs -->
    
      <text x="380" y="35" font-size="12" class="bold" fill="#111827">POS Counter</text>
      <line x1="380" y1="44" x2="457" y2="44" stroke="#111827" stroke-width="2"/>
    
      <text x="498" y="35" font-size="12" class="medium" fill="#6B7280">Today&apos;s Orders (18)</text>
      
    
    
      <rect x="680" y="18" width="180" height="26" rx="13" fill="#F9FAFB" stroke="#E5E7EB"/>
      <circle cx="694" cy="31" r="4" fill="#10B981"/>
      <text x="706" y="35" font-size="11" class="semi" fill="#111827">Today&apos;s Sales: ₹42,580</text>
    

    <!-- Right Controls -->
    <!-- Status Dot -->
    <g transform="translate(1080, 18)">
      <rect x="0" y="0" width="130" height="26" rx="13" fill="#F9FAFB" stroke="#E5E7EB"/>
      <circle cx="12" cy="13" r="3.5" fill="#10B981"/>
      <text x="22" y="17" font-size="10" class="medium" fill="#374151">Online · Printer Ready</text>
    </g>

    <!-- Global Clock -->
    <g transform="translate(1225, 17)">
      <text x="50" y="14" font-size="13" class="bold" fill="#111827" text-anchor="end">11:05 PM</text>
      <text x="50" y="25" font-size="9" class="medium" fill="#9CA3AF" text-anchor="end">Wednesday, Nov 12</text>
    </g>

    <!-- Staff Profile Pill -->
    <g transform="translate(1290, 15)">
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#FFFFFF" stroke="#D1D5DB"/>
      <circle cx="16" cy="16" r="11" fill="#374151"/>
      <text x="16" y="20" font-size="9" class="bold" fill="#FFFFFF" text-anchor="middle">PR</text>
      <text x="34" y="15" font-size="11" class="semi" fill="#111827">Priya</text>
      <text x="34" y="26" font-size="9" class="regular" fill="#6B7280">Cashier</text>
      <!-- Down arrow -->
      <path d="M112 14L116 18L120 14" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>
  

  <!-- Customization popup sheet over POS -->
  <rect x="0" y="60" width="1440" height="840" fill="rgba(17, 24, 39, 0.4)"/>
  <g transform="translate(420, 110)">
    <rect x="0" y="0" width="600" height="710" rx="24" fill="#FFFFFF" stroke="#E5E7EB" filter="drop-shadow(0 25px 40px rgba(0,0,0,0.25))"/>
    <g transform="translate(40, 36)">
      <!-- Header -->
      <text x="0" y="24" font-size="22" class="bold" fill="#111827">Beast Style Smash Burger</text>
      <text x="0" y="46" font-size="13" class="regular" fill="#6B7280">Customized double patty smash with caramelized onions and house sauce</text>
      <text x="0" y="74" font-size="18" class="bold" fill="#10B981">₹349.00</text>
      <line x1="0" y1="92" x2="520" y2="92" stroke="#E5E7EB"/>

      <!-- Free Toppings -->
      <g transform="translate(0, 110)">
        <text x="0" y="16" font-size="13" class="bold" fill="#374151">Select Sauce (Choose 1 Free)</text>
        
          <rect x="0" y="28" width="168" height="42" rx="10" fill="#111827" stroke="#111827"/>
          <text x="84" y="54" font-size="11" class="bold" fill="#FFFFFF" text-anchor="middle">House Special Sauce [✓]</text>
        
          <rect x="175" y="28" width="168" height="42" rx="10" fill="#F9FAFB" stroke="#D1D5DB"/>
          <text x="259" y="54" font-size="11" class="bold" fill="#374151" text-anchor="middle">Spicy Chipotle Aioli</text>
        
          <rect x="350" y="28" width="168" height="42" rx="10" fill="#F9FAFB" stroke="#D1D5DB"/>
          <text x="434" y="54" font-size="11" class="bold" fill="#374151" text-anchor="middle">Truffle Mayo (+₹30)</text>
        
      </g>

      <!-- Paid Extra Add-ons -->
      <g transform="translate(0, 215)">
        <text x="0" y="16" font-size="13" class="bold" fill="#374151">Add Premium Toppings (Optional)</text>
        
          <rect x="0" y="28" width="520" height="44" rx="10" fill="#F0FDF4" stroke="#10B981"/>
          <text x="16" y="55" font-size="13" class="semi" fill="#111827">Extra Melted Cheddar Slice</text>
          <text x="504" y="55" font-size="13" class="bold" fill="#10B981" text-anchor="end">+₹50 [✓]</text>
        
          <rect x="0" y="80" width="520" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="16" y="107" font-size="13" class="semi" fill="#111827">Crispy Bacon Rashers</text>
          <text x="504" y="107" font-size="13" class="bold" fill="#6B7280" text-anchor="end">+₹80 [+]</text>
        
          <rect x="0" y="132" width="520" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="16" y="159" font-size="13" class="semi" fill="#111827">Jalapeño Poppers (2pcs)</text>
          <text x="504" y="159" font-size="13" class="bold" fill="#6B7280" text-anchor="end">+₹60 [+]</text>
        
      </g>

      <!-- Quantity Stepper -->
      <g transform="translate(0, 420)">
        <text x="0" y="24" font-size="14" class="bold" fill="#111827">Order Quantity</text>
        <g transform="translate(380, 0)">
          <rect x="0" y="0" width="42" height="42" rx="10" fill="#F3F4F6" stroke="#D1D5DB"/>
          <text x="21" y="26" font-size="18" class="bold" fill="#374151" text-anchor="middle">−</text>
          <text x="70" y="27" font-size="18" class="bold" fill="#111827" text-anchor="middle">1</text>
          <rect x="98" y="0" width="42" height="42" rx="10" fill="#111827"/>
          <text x="119" y="26" font-size="18" class="bold" fill="#FFFFFF" text-anchor="middle">+</text>
        </g>
      </g>

      <!-- Bottom Add to Cart CTA -->
      <g transform="translate(0, 520)">
        <rect x="0" y="0" width="520" height="56" rx="14" fill="#10B981"/>
        <text x="26" y="34" font-size="15" class="bold" fill="#FFFFFF">Total: ₹399.00</text>
        <text x="494" y="34" font-size="15" class="bold" fill="#FFFFFF" text-anchor="end">Add to Cart →</text>
      </g>
    </g>
  </g>

</svg>