<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
  <rect width="1440" height="900" fill="#111827"/>
  <rect x="0" y="0" width="1440" height="60" fill="#1F2937" stroke="#374151"/>
  <text x="32" y="36" font-size="16" class="bold" fill="#FFFFFF">KDS — KITCHEN BOARD</text>
  <g transform="translate(1220, 15)">
    <rect x="0" y="0" width="190" height="32" rx="8" fill="#374151"/>
    <text x="95" y="20" font-size="11" class="bold" fill="#FFFFFF" text-anchor="middle">↺ Recall Bumped (#330)</text>
  </g>

  <!-- Empty state hero -->
  <g transform="translate(470, 260)">
    <circle cx="250" cy="120" r="80" fill="#1F2937" stroke="#374151" stroke-width="2"/>
    <!-- Checkmark & sparkles -->
    <path d="M225 120L242 137L278 101" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="250" y="250" font-size="26" class="bold" fill="#FFFFFF" text-anchor="middle">You're All Caught Up!</text>
    <text x="250" y="280" font-size="15" class="regular" fill="#9CA3AF" text-anchor="middle">No pending tickets in queue. Ready for next order.</text>
    
    <rect x="160" y="315" width="180" height="44" rx="10" fill="#374151"/>
    <text x="250" y="342" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">View Bumped History</text>
  </g>

</svg>