<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
  <rect width="1440" height="900" fill="#111827"/>
  <rect x="0" y="0" width="1440" height="60" fill="#1F2937" stroke="#374151"/>
  <g transform="translate(24, 16)">
    <text x="0" y="20" font-size="16" class="bold" fill="#FFFFFF">KDS — GRILL STATION</text>
    <text x="210" y="20" font-size="12" class="medium" fill="#F59E0B">Active Grill Load: 4 Patties · 2 Toastings</text>
  </g>
  <g transform="translate(1220, 16)">
    <rect x="0" y="0" width="190" height="30" rx="8" fill="#374151"/>
    <text x="95" y="19" font-size="11" class="bold" fill="#FFFFFF" text-anchor="middle">Filter: Grill Items Only</text>
  </g>

  <!-- Tickets Grid for Grill -->
  <g transform="translate(24, 80)">
    <rect x="0" y="0" width="445" height="790" rx="14" fill="#1F2937" stroke="#374151"/>
    <g transform="translate(16, 20)">
      <text x="0" y="14" font-size="14" class="bold" fill="#FFFFFF">GRILL ORDERS (2 TICKETS)</text>
      <!-- Ticket card -->
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="413" height="240" rx="12" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
        <rect x="0" y="0" width="413" height="42" rx="12" fill="#D97706"/>
        <text x="16" y="26" font-size="14" class="bold" fill="#FFFFFF">#334 · Beast Style Smash · T02</text>
        <text x="395" y="26" font-size="12" class="bold" fill="#FFFFFF" text-anchor="end">2m 10s</text>
        
        <g transform="translate(16, 60)">
          <text x="0" y="18" font-size="14" class="bold" fill="#FFFFFF">2× Smashed Beef Patty (Well Done)</text>
          <text x="0" y="34" font-size="12" class="regular" fill="#9CA3AF">• Double American Cheese Melt</text>
          <text x="0" y="50" font-size="12" class="regular" fill="#9CA3AF">• Grilled Diced Onions</text>
          <rect x="0" y="120" width="381" height="44" rx="8" fill="#10B981"/>
          <text x="190" y="148" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">✓ BUMP GRILL ITEM</text>
        </g>
      </g>
    </g>
  </g>

</svg>