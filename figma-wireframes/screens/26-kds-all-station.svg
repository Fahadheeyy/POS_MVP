<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
  <rect width="1440" height="900" fill="#111827"/>
  <!-- Dark theme KDS header -->
  <rect x="0" y="0" width="1440" height="60" fill="#1F2937" stroke="#374151"/>
  <g transform="translate(24, 16)">
    <text x="0" y="20" font-size="16" class="bold" fill="#FFFFFF">KDS — ALL STATIONS</text>
    <text x="210" y="20" font-size="12" class="medium" fill="#9CA3AF">Active Orders: 6 · Avg Ticket Time: 4.8m</text>
  </g>

  <!-- Station filter tabs -->
  <g transform="translate(560, 16)">
    <rect x="0" y="0" width="70" height="30" rx="8" fill="#10B981"/>
    <text x="35" y="19" font-size="11" class="bold" fill="#FFFFFF" text-anchor="middle">All (6)</text>
    <rect x="80" y="0" width="70" height="30" rx="8" fill="#374151"/>
    <text x="115" y="19" font-size="11" class="medium" fill="#9CA3AF" text-anchor="middle">Grill (2)</text>
    <rect x="160" y="0" width="70" height="30" rx="8" fill="#374151"/>
    <text x="195" y="19" font-size="11" class="medium" fill="#9CA3AF" text-anchor="middle">Fry (1)</text>
    <rect x="240" y="0" width="70" height="30" rx="8" fill="#374151"/>
    <text x="275" y="19" font-size="11" class="medium" fill="#9CA3AF" text-anchor="middle">Cold (3)</text>
    <rect x="320" y="0" width="70" height="30" rx="8" fill="#374151"/>
    <text x="355" y="19" font-size="11" class="medium" fill="#9CA3AF" text-anchor="middle">Expo (4)</text>
  </g>

  <!-- Right actions -->
  <g transform="translate(1180, 16)">
    <rect x="0" y="0" width="110" height="30" rx="8" fill="#374151"/>
    <text x="55" y="19" font-size="11" class="bold" fill="#FFFFFF" text-anchor="middle">↺ Bumped (14)</text>
    <rect x="120" y="0" width="110" height="30" rx="8" fill="#374151"/>
    <text x="175" y="19" font-size="11" class="bold" fill="#FFFFFF" text-anchor="middle">⚙ Settings</text>
  </g>

  <!-- 3 Kanban Columns (New, Cooking, Ready) -->
  <g transform="translate(24, 80)">
    <!-- Col 1: NEW (450w) -->
    <rect x="0" y="0" width="445" height="790" rx="14" fill="#1F2937" stroke="#374151"/>
    <g transform="translate(16, 20)">
      <circle cx="8" cy="8" r="6" fill="#3B82F6"/>
      <text x="24" y="13" font-size="14" class="bold" fill="#FFFFFF">NEW ORDERS (2)</text>
      
      <!-- Ticket 1 -->
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="413" height="260" rx="12" fill="#111827" stroke="#374151"/>
        <rect x="0" y="0" width="413" height="44" rx="12" fill="#2563EB"/>
        <text x="16" y="28" font-size="15" class="bold" fill="#FFFFFF">#334 · Dine-in T02</text>
        <text x="395" y="28" font-size="12" class="bold" fill="#FFFFFF" text-anchor="end">1m 45s</text>
        
        <g transform="translate(16, 60)">
          <text x="0" y="18" font-size="14" class="bold" fill="#FFFFFF">1× Classic Qashtuta</text>
          <text x="0" y="34" font-size="12" class="regular" fill="#9CA3AF">• Milk Chocolate · Less Ice</text>
          
          <text x="0" y="66" font-size="14" class="bold" fill="#FFFFFF">1× Mango Rice Pudding</text>
          <text x="0" y="82" font-size="12" class="regular" fill="#9CA3AF">• Crushed Pistachio</text>

          <rect x="0" y="140" width="381" height="42" rx="8" fill="#10B981"/>
          <text x="190" y="166" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">Start Cooking →</text>
        </g>
      </g>
    </g>

    <!-- Col 2: COOKING (450w) -->
    <g transform="translate(465, 0)">
      <rect x="0" y="0" width="445" height="790" rx="14" fill="#1F2937" stroke="#374151"/>
      <g transform="translate(16, 20)">
        <circle cx="8" cy="8" r="6" fill="#F59E0B"/>
        <text x="24" y="13" font-size="14" class="bold" fill="#FFFFFF">IN PREPARATION (3)</text>
        
        <!-- Ticket 2 (Rush Red Flash) -->
        <g transform="translate(0, 30)">
          <rect x="0" y="0" width="413" height="280" rx="12" fill="#111827" stroke="#EF4444" stroke-width="2"/>
          <rect x="0" y="0" width="413" height="44" rx="12" fill="#DC2626"/>
          <text x="16" y="28" font-size="15" class="bold" fill="#FFFFFF">#331 · RUSH LATE · T04</text>
          <text x="395" y="28" font-size="12" class="bold" fill="#FFFFFF" text-anchor="end">11m 20s ⚠</text>
          
          <g transform="translate(16, 60)">
            <text x="0" y="18" font-size="14" class="bold" fill="#FFFFFF">2× Lotus Biscoff Qashtuta</text>
            <text x="0" y="34" font-size="12" class="regular" fill="#9CA3AF">• 50% Sugar · Extra Crunch</text>
            
            <rect x="0" y="150" width="381" height="46" rx="8" fill="#10B981"/>
            <text x="190" y="178" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">✓ BUMP TO READY</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Col 3: READY (450w) -->
    <g transform="translate(930, 0)">
      <rect x="0" y="0" width="445" height="790" rx="14" fill="#1F2937" stroke="#374151"/>
      <g transform="translate(16, 20)">
        <circle cx="8" cy="8" r="6" fill="#10B981"/>
        <text x="24" y="13" font-size="14" class="bold" fill="#FFFFFF">READY FOR EXPO (1)</text>

        <!-- Ticket 3 -->
        <g transform="translate(0, 30)">
          <rect x="0" y="0" width="413" height="220" rx="12" fill="#111827" stroke="#10B981"/>
          <rect x="0" y="0" width="413" height="44" rx="12" fill="#059669"/>
          <text x="16" y="28" font-size="15" class="bold" fill="#FFFFFF">#330 · Takeaway Token 104</text>
          <text x="395" y="28" font-size="12" class="bold" fill="#FFFFFF" text-anchor="end">Ready (2m)</text>
          
          <g transform="translate(16, 60)">
            <text x="0" y="18" font-size="14" class="bold" fill="#FFFFFF">1× Karak Chai Glass</text>
            <rect x="0" y="100" width="381" height="44" rx="8" fill="#1F2937" stroke="#4B5563"/>
            <text x="190" y="128" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">Handed to Customer</text>
          </g>
        </g>
      </g>
    </g>
  </g>

</svg>