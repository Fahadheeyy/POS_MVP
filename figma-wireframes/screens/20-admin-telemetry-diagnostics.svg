<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
    <!-- Top Header -->
    <rect x="0" y="0" width="1440" height="55" fill="#FFFFFF" stroke="#E5E7EB"/>
    <g transform="translate(24, 15)">
      <rect x="0" y="0" width="80" height="26" rx="4" fill="#1F2937"/>
      <text x="12" y="17" font-size="11" class="bold" fill="#FFFFFF">POS.BITS</text>
      <text x="95" y="18" font-size="13" class="bold" fill="#111827">System Diagnostics &amp; Mock Engine Telemetry</text>
    </g>

    <g transform="translate(24, 75)">
      <!-- 4 Telemetry Metrics -->
      <g transform="translate(0, 0)">
        <rect width="325" height="100" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="20" y="30" font-size="11" class="bold" fill="#6B7280">TENANT CLIENT OUTLETS</text>
        <text x="20" y="65" font-size="28" class="bold" fill="#111827">4 Outlets</text>
        <text x="20" y="85" font-size="11" class="medium" fill="#10B981">Multi-tenant registered units</text>

        <g transform="translate(355, 0)">
          <rect width="325" height="100" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="20" y="30" font-size="11" class="bold" fill="#6B7280">ORDERS IN MEMORY</text>
          <text x="20" y="65" font-size="28" class="bold" fill="#111827">54 Orders</text>
          <text x="20" y="85" font-size="11" class="medium" fill="#6B7280">LocalStorage: 248 KB used</text>
        </g>

        <g transform="translate(710, 0)">
          <rect width="325" height="100" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="20" y="30" font-size="11" class="bold" fill="#6B7280">ACTIVE KDS TICKETS</text>
          <text x="20" y="65" font-size="28" class="bold" fill="#111827">7 Tickets</text>
          <text x="20" y="85" font-size="11" class="medium" fill="#10B981">Live kitchen bump queue</text>
        </g>

        <g transform="translate(1065, 0)">
          <rect width="325" height="100" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="20" y="30" font-size="11" class="bold" fill="#6B7280">ACTIVE MENU SKUS</text>
          <text x="20" y="65" font-size="28" class="bold" fill="#111827">8 Dishes</text>
          <text x="20" y="85" font-size="11" class="medium" fill="#6B7280">Mapped to 3 Add-on groups</text>
        </g>
      </g>

      <!-- Hardware & Fault Simulators -->
      <g transform="translate(0, 130)">
        <rect width="1390" height="660" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
        <g transform="translate(30, 30)">
          <text x="0" y="0" font-size="16" class="bold" fill="#111827">Hardware Failure &amp; Resilience Simulators</text>
          <text x="0" y="20" font-size="12" class="regular" fill="#6B7280">Simulate peripheral errors and network disruptions to verify recovery behavior</text>

          <!-- Simulator 1: Network -->
          <g transform="translate(0, 50)">
            <rect width="640" height="90" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
            <circle cx="45" cy="45" r="20" fill="#D1FAE5"/>
            <text x="45" y="50" font-size="14" class="bold" fill="#065F46" text-anchor="middle">📶</text>
            
            <text x="80" y="38" font-size="14" class="bold" fill="#111827">Network Connection Simulator</text>
            <text x="80" y="56" font-size="11" class="regular" fill="#4B5563">Currently: Online · Tests offline queueing and local sync banner</text>

            <rect x="490" y="26" width="130" height="36" rx="8" fill="#FEE2E2" stroke="#FCA5A5"/>
            <text x="555" y="48" font-size="11" class="bold" fill="#B91C1C" text-anchor="middle">Drop Network</text>
          </g>

          <!-- Simulator 2: Thermal Printer -->
          <g transform="translate(680, 50)">
            <rect width="640" height="90" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
            <circle cx="45" cy="45" r="20" fill="#D1FAE5"/>
            <text x="45" y="50" font-size="14" class="bold" fill="#065F46" text-anchor="middle">🖨️</text>
            
            <text x="80" y="38" font-size="14" class="bold" fill="#111827">Thermal Printer Paper Jam Simulator</text>
            <text x="80" y="56" font-size="11" class="regular" fill="#4B5563">Currently: Ready &amp; Listening · Tests printer offline alert</text>

            <rect x="490" y="26" width="130" height="36" rx="8" fill="#FEE2E2" stroke="#FCA5A5"/>
            <text x="555" y="48" font-size="11" class="bold" fill="#B91C1C" text-anchor="middle">Jam / Disconnect</text>
          </g>

          <!-- Audio Diagnostics -->
          <g transform="translate(0, 170)">
            <text x="0" y="20" font-size="14" class="bold" fill="#111827">Web Audio Tone &amp; Chime Diagnostics</text>
            <text x="0" y="38" font-size="11" class="regular" fill="#6B7280">Verify kitchen rush alerts and cashier sound feedback</text>

            <g transform="translate(0, 55)">
              <rect x="0" y="0" width="180" height="42" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
              <text x="90" y="26" font-size="11" class="bold" fill="#374151" text-anchor="middle">🔔 KDS Order Chime</text>

              <rect x="200" y="0" width="180" height="42" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
              <text x="290" y="26" font-size="11" class="bold" fill="#374151" text-anchor="middle">✨ Payment Success Tone</text>

              <rect x="400" y="0" width="180" height="42" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
              <text x="490" y="26" font-size="11" class="bold" fill="#374151" text-anchor="middle">⚠️ Error Alert Tone</text>

              <rect x="600" y="0" width="180" height="42" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
              <text x="690" y="26" font-size="11" class="bold" fill="#374151" text-anchor="middle">🖱️ Tap Click Feedback</text>
            </g>
          </g>

          <!-- Factory Reset -->
          <g transform="translate(0, 360)">
            <line x1="0" y1="0" x2="1320" y2="0" stroke="#E5E7EB"/>
            <text x="0" y="30" font-size="14" class="bold" fill="#B91C1C">Developer Factory Reset</text>
            <text x="0" y="48" font-size="11" class="regular" fill="#6B7280">Clear local transaction store, purge mock orders and restore initial seed database</text>

            <rect x="1100" y="20" width="220" height="40" rx="10" fill="#FEE2E2" stroke="#FCA5A5"/>
            <text x="1210" y="44" font-size="11" class="bold" fill="#B91C1C" text-anchor="middle">Reset Demo Database</text>
          </g>
        </g>
      </g>
    </g>
  
</svg>