      <text x="104" y="27" font-size="10" class="medium" fill="#6B7280">Store &amp; Shift Admin · Alex Rivera</text>
      
      <rect x="250" y="4" width="110" height="18" rx="4" fill="#F3F4F6" stroke="#D1D5DB"/>
      <text x="256" y="17" font-size="9" class="bold" fill="#374151">Sign Laban · Indiranagar</text>
    </g>

    <!-- Sub-navigation Tabs & Live KPIs -->
    
      <text x="380" y="35" font-size="12" class="medium" fill="#6B7280">Menu &amp; Catalog</text>
      
    
      <text x="522" y="35" font-size="12" class="medium" fill="#6B7280">Staff &amp; PINs</text>
      
    
