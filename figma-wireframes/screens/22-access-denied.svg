<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
    <!-- Centered Card -->
    <rect x="420" y="200" width="600" height="420" rx="24" fill="#FFFFFF" stroke="#D1D5DB"/>
    
    <g transform="translate(720, 270)">
      <circle cx="0" cy="0" r="40" fill="#FEE2E2" stroke="#FCA5A5"/>
      <text x="0" y="10" font-size="28" class="bold" fill="#B91C1C" text-anchor="middle">🔒</text>
      
      <text x="0" y="80" font-size="22" class="bold" fill="#111827" text-anchor="middle">Access Restricted</text>
      <text x="0" y="110" font-size="12" class="regular" fill="#4B5563" text-anchor="middle">Your currently signed-in profile does not have permission</text>
      <text x="0" y="128" font-size="12" class="regular" fill="#4B5563" text-anchor="middle">to access this terminal or executive dashboard.</text>

      <rect x="-110" y="155" width="220" height="28" rx="14" fill="#F3F4F6"/>
      <text x="0" y="173" font-size="11" class="semi" fill="#374151" text-anchor="middle">Required Role: Owner / Manager</text>

      <g transform="translate(-140, 215)">
        <rect width="280" height="44" rx="12" fill="#1F2937"/>
        <text x="140" y="27" font-size="12" class="bold" fill="#FFFFFF" text-anchor="middle">Switch Profile / Back to Login →</text>
      </g>
    </g>
  
</svg>