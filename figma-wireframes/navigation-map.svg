<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
    <rect x="0" y="0" width="1440" height="900" fill="#FFFFFF"/>
    <g transform="translate(60, 40)">
      <text x="0" y="24" font-size="22" class="bold" fill="#111827">System Application Navigation &amp; Role Clearance Map</text>
      <text x="0" y="48" font-size="13" class="regular" fill="#6B7280">Visual topology connecting all routes, roles, and allowed transitions across pos.bits</text>

      <!-- Nodes -->
      <g transform="translate(0, 90)">
        <!-- Setup Wizard -->
        <g transform="translate(0, 0)">
          <rect width="250" height="100" rx="12" fill="#F3F4F6" stroke="#111827" stroke-width="2"/>
          <text x="20" y="30" font-size="13" class="bold" fill="#111827">/setup</text>
          <text x="20" y="50" font-size="11" class="semi" fill="#4B5563">Counter Setup Wizard</text>
          <text x="20" y="70" font-size="10" class="regular" fill="#6B7280">First-launch store initialization</text>
        </g>

        <!-- Login / Auth -->
        <g transform="translate(320, 0)">
          <rect width="250" height="100" rx="12" fill="#1F2937"/>
          <text x="20" y="30" font-size="13" class="bold" fill="#FFFFFF">/login</text>
          <text x="20" y="50" font-size="11" class="semi" fill="#D1D5DB">Role Selection &amp; Auth Gateway</text>
          <text x="20" y="70" font-size="10" class="regular" fill="#9CA3AF">PIN 1234, 1111, 9999, 8888, 0000</text>
        </g>

        <!-- POS Express -->
        <g transform="translate(640, 0)">
          <rect width="250" height="100" rx="12" fill="#F3F4F6" stroke="#111827" stroke-width="2"/>
          <text x="20" y="30" font-size="13" class="bold" fill="#111827">/pos</text>
          <text x="20" y="50" font-size="11" class="semi" fill="#4B5563">POS Express Counter</text>
          <text x="20" y="70" font-size="10" class="bold" fill="#10B981">Roles: Cashier, Manager, Owner, Admin</text>
        </g>

        <!-- Today Orders -->
        <g transform="translate(960, 0)">
          <rect width="250" height="100" rx="12" fill="#F3F4F6" stroke="#D1D5DB"/>
          <text x="20" y="30" font-size="13" class="bold" fill="#111827">/orders</text>
          <text x="20" y="50" font-size="11" class="semi" fill="#4B5563">Today&apos;s Orders List</text>
          <text x="20" y="70" font-size="10" class="regular" fill="#6B7280">Reprint &amp; refund drawer</text>
        </g>

        <!-- KDS -->
        <g transform="translate(0, 160)">
          <rect width="250" height="100" rx="12" fill="#F3F4F6" stroke="#111827" stroke-width="2"/>
          <text x="20" y="30" font-size="13" class="bold" fill="#111827">/kds</text>
          <text x="20" y="50" font-size="11" class="semi" fill="#4B5563">Kitchen Display (KDS)</text>
          <text x="20" y="70" font-size="10" class="bold" fill="#10B981">Roles: Kitchen, Manager, Owner, Admin</text>
        </g>

        <!-- Manager -->
        <g transform="translate(320, 160)">
          <rect width="250" height="100" rx="12" fill="#F3F4F6" stroke="#111827" stroke-width="2"/>
          <text x="20" y="30" font-size="13" class="bold" fill="#111827">/manager</text>
          <text x="20" y="50" font-size="11" class="semi" fill="#4B5563">Manager Console</text>
          <text x="20" y="70" font-size="10" class="bold" fill="#10B981">Roles: Manager, Owner, Admin</text>
        </g>

        <!-- Owner -->
        <g transform="translate(640, 160)">
          <rect width="250" height="100" rx="12" fill="#F3F4F6" stroke="#111827" stroke-width="2"/>
          <text x="20" y="30" font-size="13" class="bold" fill="#111827">/owner</text>
          <text x="20" y="50" font-size="11" class="semi" fill="#4B5563">Owner Dashboard</text>
          <text x="20" y="70" font-size="10" class="bold" fill="#10B981">Roles: Owner, Admin</text>
        </g>

        <!-- Reports -->
        <g transform="translate(960, 160)">
          <rect width="250" height="100" rx="12" fill="#F3F4F6" stroke="#D1D5DB"/>
          <text x="20" y="30" font-size="13" class="bold" fill="#111827">/owner/reports</text>
          <text x="20" y="50" font-size="11" class="semi" fill="#4B5563">9 Exportable Business Reports</text>
          <text x="20" y="70" font-size="10" class="bold" fill="#10B981">Roles: Owner, Admin</text>
        </g>

        <!-- Admin Portal -->
        <g transform="translate(320, 320)">
          <rect width="250" height="100" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
          <text x="20" y="30" font-size="13" class="bold" fill="#60A5FA">/admin</text>
          <text x="20" y="50" font-size="11" class="semi" fill="#FFFFFF">Developer &amp; Sales Operations</text>
          <text x="20" y="70" font-size="10" class="bold" fill="#34D399">Master Clearance: Admin (PIN 0000)</text>
        </g>

        <!-- Shift -->
        <g transform="translate(640, 320)">
          <rect width="250" height="100" rx="12" fill="#F3F4F6" stroke="#D1D5DB"/>
          <text x="20" y="30" font-size="13" class="bold" fill="#111827">/shift</text>
          <text x="20" y="50" font-size="11" class="semi" fill="#4B5563">Shift &amp; Register Management</text>
          <text x="20" y="70" font-size="10" class="regular" fill="#6B7280">Reconciliation &amp; note counting</text>
        </g>
      </g>
    </g>
  
</svg>