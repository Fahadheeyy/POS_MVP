<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
    <rect x="0" y="0" width="1440" height="900" fill="#FFFFFF"/>
    <g transform="translate(60, 40)">
      <text x="0" y="24" font-size="22" class="bold" fill="#111827">KDS 3-Lane Kitchen Ticket Lifecycle</text>
      <text x="0" y="48" font-size="13" class="regular" fill="#6B7280">Visual progression from POS checkout to prep, ready pass, and recall capability</text>

      <g transform="translate(0, 100)">
        
              <g transform="translate(0, 0)">
                <rect width="310" height="480" rx="18" fill="#F9FAFB" stroke="#D1D5DB"/>
                <rect width="310" height="50" rx="18" fill="#FEF3C7"/>
                <text x="16" y="32" font-size="12" class="bold" fill="#92400E">Lane 1: Incoming Orders (New)</text>

                <g transform="translate(20, 80)">
                  <rect width="270" height="160" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
                  <text x="15" y="30" font-size="13" class="bold" fill="#111827">Token #106</text>
                  <text x="15" y="55" font-size="11" class="regular" fill="#4B5563">1x Qashtuta Nutella</text>
                  <text x="15" y="75" font-size="11" class="regular" fill="#4B5563">2x Umm Ali Claypot</text>
                  
                  <rect x="15" y="110" width="240" height="34" rx="6" fill="#1F2937"/>
                  <text x="135" y="132" font-size="10" class="bold" fill="#FFFFFF" text-anchor="middle">Drag or Tap "Start Cooking"</text>
                </g>
              </g>
            
              <g transform="translate(335, 0)">
                <rect width="310" height="480" rx="18" fill="#F9FAFB" stroke="#D1D5DB"/>
                <rect width="310" height="50" rx="18" fill="#FEF3C7"/>
                <text x="16" y="32" font-size="12" class="bold" fill="#92400E">Lane 2: Cooking In Progress</text>

                <g transform="translate(20, 80)">
                  <rect width="270" height="160" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
                  <text x="15" y="30" font-size="13" class="bold" fill="#111827">Token #106</text>
                  <text x="15" y="55" font-size="11" class="regular" fill="#4B5563">1x Qashtuta Nutella</text>
                  <text x="15" y="75" font-size="11" class="regular" fill="#4B5563">2x Umm Ali Claypot</text>
                  
                  <rect x="15" y="110" width="240" height="34" rx="6" fill="#1F2937"/>
                  <text x="135" y="132" font-size="10" class="bold" fill="#FFFFFF" text-anchor="middle">Individual item strikes or Tap "Mark Ready"</text>
                </g>
              </g>
            
              <g transform="translate(670, 0)">
                <rect width="310" height="480" rx="18" fill="#F9FAFB" stroke="#D1D5DB"/>
                <rect width="310" height="50" rx="18" fill="#D1FAE5"/>
                <text x="16" y="32" font-size="12" class="bold" fill="#065F46">Lane 3: Ready for Pass</text>

                <g transform="translate(20, 80)">
                  <rect width="270" height="160" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
                  <text x="15" y="30" font-size="13" class="bold" fill="#111827">Token #106</text>
                  <text x="15" y="55" font-size="11" class="regular" fill="#4B5563">1x Qashtuta Nutella</text>
                  <text x="15" y="75" font-size="11" class="regular" fill="#4B5563">2x Umm Ali Claypot</text>
                  
                  <rect x="15" y="110" width="240" height="34" rx="6" fill="#1F2937"/>
                  <text x="135" y="132" font-size="10" class="bold" fill="#FFFFFF" text-anchor="middle">Expedite & Tap "Bump Order"</text>
                </g>
              </g>
            
              <g transform="translate(1005, 0)">
                <rect width="310" height="480" rx="18" fill="#F9FAFB" stroke="#D1D5DB"/>
                <rect width="310" height="50" rx="18" fill="#F3F4F6"/>
                <text x="16" y="32" font-size="12" class="bold" fill="#374151">Archive: Bumped History</text>

                <g transform="translate(20, 80)">
                  <rect width="270" height="160" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
                  <text x="15" y="30" font-size="13" class="bold" fill="#111827">Token #106</text>
                  <text x="15" y="55" font-size="11" class="regular" fill="#4B5563">1x Qashtuta Nutella</text>
                  <text x="15" y="75" font-size="11" class="regular" fill="#4B5563">2x Umm Ali Claypot</text>
                  
                  <rect x="15" y="110" width="240" height="34" rx="6" fill="#1F2937"/>
                  <text x="135" y="132" font-size="10" class="bold" fill="#FFFFFF" text-anchor="middle">Can Recall ticket anytime back to board</text>
                </g>
              </g>
            
      </g>
    </g>
  
</svg>