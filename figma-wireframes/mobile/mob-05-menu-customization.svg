      <text x="326" y="25" font-size="12" class="bold" fill="#10B981" text-anchor="end">+₹40 [✓]</text>
    </g>

    <!-- Add to Cart CTA -->
    <g transform="translate(24, 280)">
      <rect x="0" y="0" width="342" height="50" rx="14" fill="#111827"/>
      <text x="20" y="30" font-size="13" class="bold" fill="#FFFFFF">1 Item · ₹339</text>
      <text x="322" y="30" font-size="13" class="bold" fill="#FFFFFF" text-anchor="end">Add to Order →</text>
    </g>
