    <text x="48" y="162" font-size="10" class="bold" fill="#9CA3AF" text-anchor="middle">IMG</text>
    <text x="96" y="142" font-size="13" class="bold" fill="#111827">Lotus Biscoff Qashtuta</text>
    <text x="96" y="158" font-size="11" class="regular" fill="#6B7280">Biscoff spread with biscuit crumbs</text>
    <text x="96" y="184" font-size="13" class="bold" fill="#111827">₹299</text>
