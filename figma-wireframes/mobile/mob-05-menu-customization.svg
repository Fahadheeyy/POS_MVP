    <text x="24" y="46" font-size="15" class="bold" fill="#111827">Customize Lotus Biscoff</text>
    <text x="24" y="64" font-size="11" class="regular" fill="#6B7280">Select sweetness, cream level and extra toppings</text>

    <!-- Sweetness -->
    <text x="24" y="98" font-size="12" class="bold" fill="#374151">Sweetness Level</text>
    <g transform="translate(24, 108)">
      <rect x="0" y="0" width="76" height="32" rx="8" fill="#F3F4F6"/>
      <text x="38" y="20" font-size="11" class="semi" fill="#4B5563" text-anchor="middle">30% (Low)</text>
      <rect x="84" y="0" width="84" height="32" rx="8" fill="#111827"/>
      <text x="126" y="20" font-size="11" class="bold" fill="#FFFFFF" text-anchor="middle">50% (Std)</text>
      <rect x="176" y="0" width="76" height="32" rx="8" fill="#F3F4F6"/>
      <text x="214" y="20" font-size="11" class="semi" fill="#4B5563" text-anchor="middle">100% (High)</text>
    </g>

