    <rect x="68" y="0" width="80" height="28" rx="14" fill="#F3F4F6"/>
    <text x="108" y="18" font-size="11" class="semi" fill="#4B5563" text-anchor="middle">Qashtuta</text>
    <rect x="156" y="0" width="90" height="28" rx="14" fill="#F3F4F6"/>
    <text x="201" y="18" font-size="11" class="semi" fill="#4B5563" text-anchor="middle">Rice Pudding</text>
    <rect x="254" y="0" width="70" height="28" rx="14" fill="#F3F4F6"/>
    <text x="289" y="18" font-size="11" class="semi" fill="#4B5563" text-anchor="middle">Drinks</text>
  </g>

