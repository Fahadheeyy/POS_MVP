<?xml version="1.0" encoding="UTF-8"?>
<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="390" height="844" fill="#F3F4F6"/>
  
  
    <!-- Mobile Status Bar -->
    <rect x="0" y="0" width="390" height="44" fill="#FFFFFF"/>
    <text x="24" y="30" font-size="12" class="bold" fill="#111827">9:41</text>
    <circle cx="340" cy="26" r="3" fill="#111827"/>
    <circle cx="348" cy="26" r="3" fill="#111827"/>
    <rect x="356" y="21" width="18" height="10" rx="3" fill="none" stroke="#111827" stroke-width="1.5"/>
    <rect x="358" y="23" width="12" height="6" rx="1.5" fill="#111827"/>

    <!-- Mobile Nav Bar -->
    <rect x="0" y="44" width="390" height="52" fill="#FFFFFF" stroke="#E5E7EB"/>
    
      <g transform="translate(16, 58)">
        <circle cx="12" cy="12" r="12" fill="#F3F4F6"/>
        <path d="M14 8L10 12L14 16" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    
    <text x="52" y="76" font-size="15" class="bold" fill="#111827">Create New Order</text>
    <text x="370" y="76" font-size="11" class="medium" fill="#6B7280" text-anchor="end">Quick Tap</text>
  
  <g transform="translate(20, 110)">
    <!-- Order Type Selector -->
    <rect x="0" y="0" width="350" height="52" rx="14" fill="#F3F4F6" stroke="#E5E7EB"/>
    <rect x="4" y="4" width="110" height="44" rx="10" fill="#111827"/>
    <text x="59" y="30" font-size="12" class="bold" fill="#FFFFFF" text-anchor="middle">Dine-in</text>
    <text x="175" y="30" font-size="12" class="semi" fill="#4B5563" text-anchor="middle">Takeaway</text>
    <text x="290" y="30" font-size="12" class="semi" fill="#4B5563" text-anchor="middle">Delivery</text>

    <!-- Form Inputs -->
    <rect x="0" y="74" width="350" height="240" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="20" y="32" font-size="12" class="bold" fill="#374151">Select Table</text>
    <rect x="20" y="42" width="310" height="42" rx="10" fill="#F9FAFB" stroke="#D1D5DB"/>
    <text x="36" y="68" font-size="13" class="semi" fill="#111827">Table 05 (2-seater)</text>
    <text x="314" y="68" font-size="12" fill="#9CA3AF" text-anchor="end">▼</text>

    <text x="20" y="112" font-size="12" class="bold" fill="#374151">Customer Name (Optional)</text>
    <rect x="20" y="122" width="310" height="42" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="36" y="148" font-size="13" class="regular" fill="#111827">Jesselyn Anamika</text>

    <text x="20" y="192" font-size="12" class="bold" fill="#374151">Phone Number (Loyalty CRM)</text>
    <rect x="20" y="202" width="310" height="42" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="36" y="228" font-size="13" class="regular" fill="#111827">+91 98450 12345</text>
    
    <!-- Guest Count Stepper -->
    <rect x="0" y="335" width="350" height="120" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="20" y="36" font-size="13" class="bold" fill="#111827">Number of Guests</text>
    <text x="20" y="56" font-size="11" class="regular" fill="#6B7280">Calculates cutlery and kitchen ticket sizes</text>
    <g transform="translate(190, 32)">
      <rect x="0" y="0" width="38" height="38" rx="10" fill="#F3F4F6" stroke="#D1D5DB"/>
      <text x="19" y="24" font-size="16" class="bold" fill="#374151" text-anchor="middle">−</text>
      <text x="65" y="25" font-size="16" class="bold" fill="#111827" text-anchor="middle">2</text>
      <rect x="92" y="0" width="38" height="38" rx="10" fill="#111827"/>
      <text x="111" y="24" font-size="16" class="bold" fill="#FFFFFF" text-anchor="middle">+</text>
    </g>
  </g>

  <!-- Submit button -->
  <g transform="translate(20, 755)">
    <rect x="0" y="0" width="350" height="50" rx="14" fill="#111827"/>
    <text x="175" y="31" font-size="14" class="bold" fill="#FFFFFF" text-anchor="middle">Proceed to Menu Catalog →</text>
  </g>

</svg>