<?xml version="1.0" encoding="UTF-8"?>
<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="390" height="844" fill="#F3F4F6"/>
  
  
    <!-- Mobile Status Bar -->
    <rect x="0" y="0" width="390" height="44" fill="#FFFFFF"/>
    <text x="24" y="30" font-size="12" class="bold" fill="#111827">9:41</text>
    <circle cx="340" cy="26" r="3" fill="#111827"/>
    <circle cx="348" cy="26" r="3" fill="#111827"/>
    <rect x="356" y="21" width="18" height="10" rx="3" fill="none" stroke="#111827" stroke-width="1.5"/>
    <rect x="358" y="23" width="12" height="6" rx="1.5" fill="#111827"/>

    <!-- Mobile Nav Bar -->
    <rect x="0" y="44" width="390" height="52" fill="#FFFFFF" stroke="#E5E7EB"/>
    
    <text x="20" y="76" font-size="15" class="bold" fill="#111827">Staff Sign In</text>
    <text x="370" y="76" font-size="11" class="medium" fill="#6B7280" text-anchor="end">Sign Laban</text>
  
  <g transform="translate(20, 115)">
    <rect x="0" y="0" width="350" height="180" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="24" y="36" font-size="16" class="bold" fill="#111827">Select Active Staff</text>
    <text x="24" y="56" font-size="12" class="regular" fill="#6B7280">Enter 4-digit PIN to unlock POS counter</text>

    <!-- Staff Pill -->
    <rect x="24" y="76" width="302" height="48" rx="12" fill="#F9FAFB" stroke="#D1D5DB"/>
    <circle cx="52" cy="100" r="16" fill="#111827"/>
    <text x="52" y="105" font-size="11" class="bold" fill="#FFFFFF" text-anchor="middle">PR</text>
    <text x="80" y="96" font-size="13" class="bold" fill="#111827">Priya Sharma</text>
    <text x="80" y="112" font-size="11" class="regular" fill="#6B7280">Cashier · Shift #1</text>
    <text x="306" y="105" font-size="14" fill="#9CA3AF" text-anchor="end">▼</text>

    <!-- PIN dots -->
    <g transform="translate(100, 142)">
      <circle cx="20" cy="14" r="7" fill="#111827"/>
      <circle cx="60" cy="14" r="7" fill="#111827"/>
      <circle cx="100" cy="14" r="7" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
      <circle cx="140" cy="14" r="7" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Keypad -->
  <g transform="translate(45, 320)">
    
        <rect x="0" y="0" width="90" height="60" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="45" y="38" font-size="20" class="semi" fill="#111827" text-anchor="middle">1</text>
      
        <rect x="105" y="0" width="90" height="60" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="150" y="38" font-size="20" class="semi" fill="#111827" text-anchor="middle">2</text>
      
        <rect x="210" y="0" width="90" height="60" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="255" y="38" font-size="20" class="semi" fill="#111827" text-anchor="middle">3</text>
      
        <rect x="0" y="72" width="90" height="60" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="45" y="110" font-size="20" class="semi" fill="#111827" text-anchor="middle">4</text>
      
        <rect x="105" y="72" width="90" height="60" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="150" y="110" font-size="20" class="semi" fill="#111827" text-anchor="middle">5</text>
      
        <rect x="210" y="72" width="90" height="60" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="255" y="110" font-size="20" class="semi" fill="#111827" text-anchor="middle">6</text>
      
        <rect x="0" y="144" width="90" height="60" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="45" y="182" font-size="20" class="semi" fill="#111827" text-anchor="middle">7</text>
      
        <rect x="105" y="144" width="90" height="60" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="150" y="182" font-size="20" class="semi" fill="#111827" text-anchor="middle">8</text>
      
        <rect x="210" y="144" width="90" height="60" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="255" y="182" font-size="20" class="semi" fill="#111827" text-anchor="middle">9</text>
      
        <rect x="0" y="216" width="90" height="60" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="45" y="254" font-size="20" class="semi" fill="#111827" text-anchor="middle">C</text>
      
        <rect x="105" y="216" width="90" height="60" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="150" y="254" font-size="20" class="semi" fill="#111827" text-anchor="middle">0</text>
      
        <rect x="210" y="216" width="90" height="60" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="255" y="254" font-size="20" class="semi" fill="#111827" text-anchor="middle">⌫</text>
      
  </g>

  <!-- Quick Demo Hint -->
  <rect x="20" y="770" width="350" height="42" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="175" y="796" font-size="11" class="medium" fill="#065F46" text-anchor="middle">Default Demo Cashier PIN: 1234</text>

