<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
    <!-- Top Header -->
    <rect x="0" y="0" width="1440" height="55" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="24" y="32" font-size="13" class="bold" fill="#111827">POS Express Counter · Sign Laban</text>

    <!-- Prominent Offline Alert Banner -->
    <rect x="0" y="55" width="1440" height="42" fill="#FEF3C7" stroke="#FDE68A"/>
    <circle cx="36" cy="76" r="6" fill="#D97706"/>
    <text x="52" y="80" font-size="12" class="bold" fill="#92400E">Network Connection Lost · Simulating Offline Mode</text>
    <text x="450" y="80" font-size="12" class="medium" fill="#B45309">Orders are safely queued in local memory (3 orders queued). POS functions normally.</text>
    
    <rect x="1300" y="62" width="115" height="28" rx="6" fill="#1F2937"/>
    <text x="1357" y="80" font-size="10" class="bold" fill="#FFFFFF" text-anchor="middle">Sync Now ↺</text>

    <!-- POS Body Preview -->
    <g transform="translate(24, 120)">
      <rect width="980" height="740" rx="16" fill="#FFFFFF" stroke="#D1D5DB"/>
      <text x="30" y="40" font-size="14" class="bold" fill="#111827">POS Express Menu Catalog (Offline Ready)</text>
      <text x="30" y="60" font-size="11" class="regular" fill="#6B7280">Transactions will be dispatched automatically upon network reconnect</text>
    </g>
    <g transform="translate(1030, 120)">
      <rect width="385" height="740" rx="16" fill="#FFFFFF" stroke="#D1D5DB"/>
      <text x="30" y="40" font-size="14" class="bold" fill="#111827">Offline Cart Queue</text>
    </g>
  
</svg>