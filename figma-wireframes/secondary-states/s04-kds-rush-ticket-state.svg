<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
    <!-- Highlighted Rush Ticket Card (800x600 Centered) -->
    <g transform="translate(360, 160)">
      <rect width="720" height="520" rx="20" fill="#FFFFFF" stroke="#EF4444" stroke-width="3"/>
      
      <!-- Pulsing Red Alert Header -->
      <rect width="720" height="60" rx="20" fill="#FEE2E2"/>
      <text x="30" y="38" font-size="18" class="bold" fill="#B91C1C">🔥 RUSH DELAY: Token #104 (+14m 22s)</text>
      <text x="690" y="38" font-size="14" class="bold" fill="#B91C1C" text-anchor="end">EXCEEDED TARGET (6m)</text>

      <g transform="translate(30, 90)">
        <rect width="660" height="60" rx="10" fill="#FEF2F2"/>
        <text x="20" y="35" font-size="13" class="bold" fill="#991B1B">Allergy / Expedite Note: Priority Rush · VIP Customer Table</text>

        <!-- Ticket Items -->
        <g transform="translate(0, 85)">
          <text x="0" y="24" font-size="16" class="bold" fill="#111827">3x Koushiri Rice Pudding (Cold Station)</text>
          <text x="20" y="44" font-size="12" class="regular" fill="#6B7280">• Extra cinnamon dusting requested</text>

          <text x="0" y="80" font-size="16" class="bold" fill="#111827">1x Umm Ali Royal Claypot (Grill Station)</text>
          <text x="20" y="100" font-size="12" class="regular" fill="#6B7280">• Double blistered crust</text>
        </g>

        <!-- Expedite Actions -->
        <g transform="translate(0, 280)">
          <rect width="660" height="50" rx="12" fill="#DC2626"/>
          <text x="330" y="31" font-size="14" class="bold" fill="#FFFFFF" text-anchor="middle">⚡ Priority Bump to Ready for Pass</text>
        </g>
      </g>
    </g>
  
</svg>