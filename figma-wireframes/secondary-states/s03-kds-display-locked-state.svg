<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
    <!-- Full Screen Kitchen Lock Overlay -->
    <rect width="1440" height="900" fill="#111827"/>
    
    <g transform="translate(520, 240)">
      <circle cx="200" cy="80" r="45" fill="#1F2937" stroke="#374151"/>
      <text x="200" y="92" font-size="32" class="bold" fill="#FFFFFF" text-anchor="middle">🔒</text>

      <text x="200" y="170" font-size="24" class="bold" fill="#FFFFFF" text-anchor="middle">Kitchen Screen Locked</text>
      <text x="200" y="195" font-size="12" class="regular" fill="#9CA3AF" text-anchor="middle">Enter kitchen staff PIN (1111) to unlock terminal</text>

      <!-- 4 PIN Dots -->
      <g transform="translate(130, 220)">
        <circle cx="20" cy="15" r="8" fill="#374151"/>
        <circle cx="60" cy="15" r="8" fill="#374151"/>
        <circle cx="100" cy="15" r="8" fill="#374151"/>
        <circle cx="140" cy="15" r="8" fill="#374151"/>
      </g>

      <rect x="80" y="280" width="240" height="46" rx="12" fill="#374151"/>
      <text x="200" y="308" font-size="12" class="bold" fill="#FFFFFF" text-anchor="middle">Unlock Terminal</text>
    </g>
  
</svg>