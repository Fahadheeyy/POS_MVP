<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
    <!-- POS Right Cart Focused on Inline Cash Tender Chips -->
    <g transform="translate(480, 100)">
      <rect width="480" height="700" rx="20" fill="#FFFFFF" stroke="#D1D5DB"/>
      
      <g transform="translate(30, 30)">
        <text x="0" y="20" font-size="18" class="bold" fill="#111827">Order Summary: ₹987.00</text>
        <text x="0" y="38" font-size="11" class="regular" fill="#6B7280">Cash Timing Flow: Before Checkout (High-Speed Express)</text>

        <!-- Inline Cash Tender Input & Denominations -->
        <g transform="translate(0, 80)">
          <rect width="420" height="220" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
          <g transform="translate(20, 20)">
            <text x="0" y="15" font-size="12" class="bold" fill="#111827">Cash Tendered by Customer</text>
            
            <rect x="0" y="25" width="380" height="44" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
            <text x="16" y="52" font-size="18" class="bold mono" fill="#111827">₹ 1,000.00</text>

            <!-- Quick Denomination Chips -->
            <g transform="translate(0, 80)">
              <rect x="0" y="0" width="85" height="32" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
              <text x="42" y="20" font-size="11" class="bold" fill="#374151" text-anchor="middle">Exact ₹987</text>

              <rect x="95" y="0" width="85" height="32" rx="6" fill="#1F2937"/>
              <text x="137" y="20" font-size="11" class="bold" fill="#FFFFFF" text-anchor="middle">₹1,000 ✓</text>

              <rect x="190" y="0" width="85" height="32" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
              <text x="232" y="20" font-size="11" class="bold" fill="#374151" text-anchor="middle">₹1,500</text>

              <rect x="285" y="0" width="95" height="32" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
              <text x="332" y="20" font-size="11" class="bold" fill="#374151" text-anchor="middle">₹2,000</text>
            </g>

            <!-- Live Change Return -->
            <line x1="0" y1="125" x2="380" y2="125" stroke="#E5E7EB"/>
            <text x="0" y="150" font-size="12" class="bold" fill="#065F46">Change Return to Customer:</text>
            <text x="380" y="150" font-size="18" class="bold mono" fill="#065F46" text-anchor="end">₹13.00</text>
          </g>
        </g>

        <!-- 1-Click Complete Checkout -->
        <g transform="translate(0, 340)">
          <rect width="420" height="48" rx="12" fill="#1F2937"/>
          <text x="210" y="30" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">Complete Cash Checkout &amp; Open Drawer →</text>
        </g>
      </g>
    </g>
  
</svg>