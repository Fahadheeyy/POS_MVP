<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
    <!-- Today's Orders with Refund Drawer Open -->
    <rect width="1440" height="900" fill="#111827" fill-opacity="0.4"/>
    
    <g transform="translate(940, 0)">
      <rect width="500" height="900" fill="#FFFFFF" stroke="#E5E7EB"/>
      <g transform="translate(35, 40)">
        <text x="0" y="20" font-size="18" class="bold" fill="#B91C1C">Refund &amp; Void Authorization</text>
        <text x="0" y="38" font-size="11" class="regular" fill="#6B7280">Order Token #101 · Amount: ₹320.00 (UPI)</text>

        <g transform="translate(0, 70)">
          <text x="0" y="15" font-size="11" class="bold" fill="#374151">Select Refund Reason *</text>
          <rect x="0" y="22" width="430" height="40" rx="8" fill="#F3F4F6"/>
          <text x="14" y="47" font-size="12" class="semi" fill="#111827">Customer changed mind prior to food preparation ▾</text>

          <text x="0" y="90" font-size="11" class="bold" fill="#374151">Manager PIN Required for Audit Approval</text>
          <rect x="0" y="98" width="430" height="42" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
          <text x="16" y="124" font-size="16" class="bold mono" fill="#111827">••••</text>
        </g>

        <g transform="translate(0, 780)">
          <rect width="430" height="46" rx="12" fill="#DC2626"/>
          <text x="215" y="28" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">Authorize Refund &amp; Void Ticket</text>
        </g>
      </g>
    </g>
  
</svg>