<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
    <!-- Dynamic UPI QR Display Modal -->
    <g transform="translate(480, 160)">
      <rect width="480" height="580" rx="24" fill="#FFFFFF" stroke="#D1D5DB"/>
      <g transform="translate(35, 35)">
        <text x="205" y="20" font-size="18" class="bold" fill="#111827" text-anchor="middle">Scan UPI QR to Pay</text>
        <text x="205" y="40" font-size="11" class="regular" fill="#6B7280" text-anchor="middle">Sign Laban Indiranagar Counter 01</text>
        <text x="205" y="80" font-size="32" class="bold" fill="#111827" text-anchor="middle">₹987.00</text>

        <!-- Large QR Box -->
        <rect x="85" y="105" width="240" height="240" rx="16" fill="#F9FAFB" stroke="#D1D5DB"/>
        <g transform="translate(105, 125)">
          <rect width="200" height="200" fill="#FFFFFF"/>
          <text x="100" y="115" font-size="40" class="bold" fill="#111827" text-anchor="middle">QR CODE</text>
        </g>

        <text x="205" y="380" font-size="12" class="bold mono" fill="#111827" text-anchor="middle">UPI ID: signlaban@icici</text>
        <text x="205" y="405" font-size="11" class="semi" fill="#10B981" text-anchor="middle">⏱ Waiting for customer payment scan (01:45)...</text>

        <g transform="translate(0, 440)">
          <rect width="410" height="46" rx="12" fill="#1F2937"/>
          <text x="205" y="28" font-size="13" class="bold" fill="#FFFFFF" text-anchor="middle">Simulate Successful Webhook →</text>
        </g>
      </g>
    </g>
  
</svg>