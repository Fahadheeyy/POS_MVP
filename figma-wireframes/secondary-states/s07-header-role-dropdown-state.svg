<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semi { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#F3F4F6"/>
  
    <!-- Global Header with Opened Role Dropdown -->
    <rect x="0" y="0" width="1440" height="60" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="24" y="35" font-size="14" class="bold" fill="#111827">POS Express Counter · Sign Laban</text>

    <!-- Role Switcher Dropdown Popover on Top Right -->
    <g transform="translate(1120, 50)">
      <rect width="290" height="340" rx="16" fill="#FFFFFF" stroke="#D1D5DB" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.1))"/>
      
      <g transform="translate(16, 20)">
        <text x="0" y="0" font-size="10" class="bold" fill="#9CA3AF">CURRENT SESSION</text>
        <text x="0" y="18" font-size="13" class="bold" fill="#111827">Priya Sharma · Head Cashier</text>
        
        <line x1="0" y1="30" x2="258" y2="30" stroke="#E5E7EB"/>

        <!-- 5 Roles List -->
        <g transform="translate(0, 45)">
          <!-- Role 1: Cashier (Active) -->
          <rect width="258" height="38" rx="8" fill="#F3F4F6"/>
          <text x="12" y="24" font-size="11" class="bold" fill="#111827">1. POS Cashier</text>
          <text x="246" y="24" font-size="10" class="bold" fill="#1F2937" text-anchor="end">PIN 1234 ✓</text>

          <!-- Role 2: Kitchen -->
          <g transform="translate(0, 44)">
            <text x="12" y="24" font-size="11" class="medium" fill="#374151">2. Kitchen Display (KDS)</text>
            <text x="246" y="24" font-size="10" class="regular" fill="#9CA3AF" text-anchor="end">PIN 1111</text>
          </g>

          <!-- Role 3: Manager -->
          <g transform="translate(0, 88)">
            <text x="12" y="24" font-size="11" class="medium" fill="#374151">3. Manager Console</text>
            <text x="246" y="24" font-size="10" class="regular" fill="#9CA3AF" text-anchor="end">PIN 9999</text>
          </g>

          <!-- Role 4: Owner -->
          <g transform="translate(0, 132)">
            <text x="12" y="24" font-size="11" class="medium" fill="#374151">4. Owner Dashboard</text>
            <text x="246" y="24" font-size="10" class="regular" fill="#9CA3AF" text-anchor="end">PIN 8888</text>
          </g>

          <!-- Role 5: Admin -->
          <g transform="translate(0, 176)">
            <rect width="258" height="36" rx="8" fill="#FEF3C7"/>
            <text x="12" y="23" font-size="11" class="bold" fill="#92400E">5. Developer &amp; Sales Admin</text>
            <text x="246" y="23" font-size="10" class="bold" fill="#92400E" text-anchor="end">PIN 0000</text>
          </g>
        </g>

        <!-- Sign out -->
        <line x1="0" y1="270" x2="258" y2="270" stroke="#E5E7EB"/>
        <text x="12" y="295" font-size="11" class="bold" fill="#B91C1C">Sign out / Lock Terminal →</text>
      </g>
    </g>
  
</svg>